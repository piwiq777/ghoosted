<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Ghoosted</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#F6F5F8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ghoosted">
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="apple-touch-icon" href="assets/icon.png">
  <link rel="manifest" href="m.webmanifest">
  <style>
    /* ======================================================================
       EL ESPEJO DEL MOVIL
       ----------------------------------------------------------------------
       Lo que el PC ya ha revisado, en el telefono. Nada de esto habla con
       Instagram: el PC cifra lo que ve, lo deja en /api/m/push, y aqui se
       descifra con una clave que solo viaja en el QR. El servidor guarda un
       bloque que no sabe leer.

       El diseño es el del lienzo "Ghoosted — iOS light": fondo claro con
       manchas de color difuminadas, vidrio en todo lo que flota, la cifra
       grande en Unbounded sobre el degradado de Instagram y una barra de
       cinco pestañas abajo.

       La CSP de la web manda aqui tambien: nada de fuentes de fuera
       (font-src 'self') y nada de fotos de Instagram (img-src 'self' data:).
       Unbounded va servida desde /assets/fonts; el texto corrido va en la
       letra del sistema, que en un iPhone ES la de Apple.
       ====================================================================== */
    @font-face{font-family:'Unbounded';font-style:normal;font-weight:500 900;font-display:swap;
      src:url(assets/fonts/unbounded-latin-ext.woff2) format('woff2');
      unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
    @font-face{font-family:'Unbounded';font-style:normal;font-weight:500 900;font-display:swap;
      src:url(assets/fonts/unbounded-latin.woff2) format('woff2');
      unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

    :root{
      --bg:#F6F5F8; --ink:#161616; --ink-2:#63636B; --ink-3:rgba(22,22,22,.28);
      --fill:rgba(22,22,22,.06); --sep:rgba(22,22,22,.07);
      --rosa:#D62976; --lila:#8E44D6; --verde:#34D27B; --ambar:#FF9F0A;
      --cifra-rosa:#D62976;
      --ig:linear-gradient(135deg,#FF9A3D 0%,#F0507A 38%,#D62976 55%,#8E44D6 82%,#5B5BE6 100%);
      --linea:linear-gradient(90deg,#F0507A,#6E4BE0);
      /* vidrio: lo que flota (botones, pestañas, cifras) */
      --v-bg:linear-gradient(135deg,rgba(255,255,255,.66) 0%,rgba(255,255,255,.26) 48%,rgba(255,255,255,.46) 100%);
      --v-filtro:blur(22px) saturate(210%) brightness(1.06);
      --v-sombra:inset 1.5px 1.5px 0 rgba(255,255,255,.98),inset -1px -1px 0 rgba(255,255,255,.5),inset 0 12px 24px rgba(255,255,255,.35),inset 0 -8px 18px rgba(255,255,255,.18),0 1px 2px rgba(30,10,50,.06),0 16px 38px rgba(60,20,90,.14);
      --v-borde:rgba(255,255,255,.55);
      /* listas: vidrio mas lechoso, para leer */
      --l-bg:rgba(255,255,255,.62);
      --l-sombra:inset 1.5px 1.5px 0 #fff,inset -1px -1px 0 rgba(255,255,255,.5),0 1px 2px rgba(22,22,22,.04),0 12px 30px rgba(60,20,90,.08);
      --l-borde:rgba(255,255,255,.6);
      /* la pieza activa (pestaña, segmento) */
      --on-bg:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,255,255,.62));
      --on-sombra:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(22,22,22,.05),0 4px 14px rgba(60,20,90,.16);
      /* cifras sobre el degradado */
      --c-bg:var(--v-bg); --c-sombra:var(--v-sombra); --c-borde:var(--v-borde);
      /* boton principal */
      --b-bg:#161616; --b-ink:#fff;
      --b-sombra:inset 1.5px 1.5px 0 rgba(255,255,255,.3),inset -1px -1px 0 rgba(0,0,0,.18),inset 0 10px 18px rgba(255,255,255,.08),0 12px 26px rgba(0,0,0,.18);
      --mancha:1;
      --marca:'Unbounded',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
      --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
      --sa-top:env(safe-area-inset-top,0px); --sa-bot:env(safe-area-inset-bottom,0px);
    }
    /* Oscuro: el mismo dibujo, con el vidrio ahumado. Va en dos sitios —el
       telefono en oscuro sin eleccion guardada, y el boton— con los mismos
       valores. */
    @media (prefers-color-scheme: dark){
      :root:not([data-tema="claro"]){
        --bg:#09090B; --ink:#F5F5F7; --ink-2:rgba(245,245,247,.58); --ink-3:rgba(245,245,247,.28);
        --fill:rgba(255,255,255,.07); --sep:rgba(255,255,255,.07);
        --cifra-rosa:#FFB3CF;
        --v-bg:linear-gradient(135deg,rgba(255,255,255,.11) 0%,rgba(255,255,255,.035) 50%,rgba(255,255,255,.07) 100%);
        --v-filtro:blur(24px) saturate(120%);
        --v-sombra:inset 1px 1px 0 rgba(255,255,255,.22),inset -1px -1px 0 rgba(255,255,255,.05),inset 0 10px 22px rgba(255,255,255,.03),0 18px 40px rgba(0,0,0,.6);
        --v-borde:rgba(255,255,255,.10);
        --l-bg:rgba(255,255,255,.045); --l-sombra:inset 1px 1px 0 rgba(255,255,255,.10),0 14px 34px rgba(0,0,0,.45); --l-borde:rgba(255,255,255,.07);
        --on-bg:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.07));
        --on-sombra:inset 1px 1px 0 rgba(255,255,255,.28),0 4px 12px rgba(0,0,0,.4);
        --c-bg:rgba(12,12,14,.30);
        --c-sombra:inset 1px 1px 0 rgba(255,255,255,.32),inset -1px -1px 0 rgba(255,255,255,.06),0 10px 24px rgba(0,0,0,.25);
        --c-borde:rgba(255,255,255,.18);
        --b-bg:#fff; --b-ink:#161616;
        --b-sombra:inset 1.5px 1.5px 0 #fff,inset -1px -1px 0 rgba(0,0,0,.18),inset 0 10px 18px rgba(255,255,255,.5),0 12px 26px rgba(0,0,0,.18);
        --mancha:.4;
      }
    }
    :root[data-tema="oscuro"]{
      --bg:#09090B; --ink:#F5F5F7; --ink-2:rgba(245,245,247,.58); --ink-3:rgba(245,245,247,.28);
      --fill:rgba(255,255,255,.07); --sep:rgba(255,255,255,.07);
      --cifra-rosa:#FFB3CF;
      --v-bg:linear-gradient(135deg,rgba(255,255,255,.11) 0%,rgba(255,255,255,.035) 50%,rgba(255,255,255,.07) 100%);
      --v-filtro:blur(24px) saturate(120%);
      --v-sombra:inset 1px 1px 0 rgba(255,255,255,.22),inset -1px -1px 0 rgba(255,255,255,.05),inset 0 10px 22px rgba(255,255,255,.03),0 18px 40px rgba(0,0,0,.6);
      --v-borde:rgba(255,255,255,.10);
      --l-bg:rgba(255,255,255,.045); --l-sombra:inset 1px 1px 0 rgba(255,255,255,.10),0 14px 34px rgba(0,0,0,.45); --l-borde:rgba(255,255,255,.07);
      --on-bg:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.07));
      --on-sombra:inset 1px 1px 0 rgba(255,255,255,.28),0 4px 12px rgba(0,0,0,.4);
      --c-bg:rgba(12,12,14,.30);
      --c-sombra:inset 1px 1px 0 rgba(255,255,255,.32),inset -1px -1px 0 rgba(255,255,255,.06),0 10px 24px rgba(0,0,0,.25);
      --c-borde:rgba(255,255,255,.18);
      --b-bg:#fff; --b-ink:#161616;
      --b-sombra:inset 1.5px 1.5px 0 #fff,inset -1px -1px 0 rgba(0,0,0,.18),inset 0 10px 18px rgba(255,255,255,.5),0 12px 26px rgba(0,0,0,.18);
      --mancha:.4;
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;background:var(--bg);color:var(--ink)}
    body{font:16px/1.35 var(--font);letter-spacing:-.015em;-webkit-font-smoothing:antialiased;
      min-height:100vh;overscroll-behavior-y:none}
    button{font:inherit;color:inherit;letter-spacing:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer}
    a{color:inherit;text-decoration:none}
    .hidden{display:none!important}
    [hidden]{display:none!important}

    /* ---------- el fondo: manchas de color difuminadas ----------
       Fijas detras de todo, para que al hacer scroll el vidrio tenga algo que
       difuminar. Van con radial-gradient y no con filter:blur, que en un
       movil con cinco capas de 300px se nota en la bateria. */
    .fondo{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:var(--mancha);
      background:
        radial-gradient(180px 180px at 20% -2%,rgba(255,154,61,.55),transparent 70%),
        radial-gradient(200px 200px at 80% -4%,rgba(142,68,214,.55),transparent 70%),
        radial-gradient(170px 170px at 95% 50%,rgba(240,80,122,.30),transparent 70%),
        radial-gradient(180px 180px at 0% 85%,rgba(110,75,224,.30),transparent 70%),
        radial-gradient(150px 150px at 90% 105%,rgba(255,154,61,.22),transparent 70%)}

    /* ---------- piezas de vidrio ---------- */
    .vidrio{background:var(--v-bg);border:.5px solid var(--v-borde);box-shadow:var(--v-sombra);
      -webkit-backdrop-filter:var(--v-filtro);backdrop-filter:var(--v-filtro)}
    .lista{border-radius:28px;padding:2px 16px;background:var(--l-bg);border:.5px solid var(--l-borde);box-shadow:var(--l-sombra);
      -webkit-backdrop-filter:blur(26px) saturate(200%);backdrop-filter:blur(26px) saturate(200%)}
    .redondo{width:44px;height:44px;flex:none;border-radius:999px;display:grid;place-items:center;color:var(--ink)}
    .redondo svg{width:19px;height:19px}
    .redondo:active{transform:scale(.93)}
    .gira svg{animation:gira .8s linear infinite}
    @keyframes gira{to{transform:rotate(360deg)}}
    .pega{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;border-radius:12px;background:#FFD66B;color:#161616;
      font:700 12px/1 var(--marca);letter-spacing:0;transform:rotate(6deg);box-shadow:0 6px 16px rgba(0,0,0,.18);white-space:nowrap}
    .principal{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;padding:0 20px;border-radius:999px;
      font-size:16px;font-weight:600;letter-spacing:-.02em;background:var(--b-bg);color:var(--b-ink);box-shadow:var(--b-sombra)}
    .principal svg{width:19px;height:19px}
    .principal:active{transform:scale(.98)}

    /* ---------- el logo en letra: los mismos ojos que en la web ---------- */
    .wm{display:inline-flex;align-items:center;font:800 22px/1 var(--marca);letter-spacing:-.04em;color:var(--ink);white-space:nowrap}
    .wm-ojos{display:inline-flex;gap:.04em;margin:0 .03em;transform:translateY(.04em)}
    .wm-ojos i{position:relative;width:.7em;height:.7em;border-radius:50%;background:currentColor}
    .wm-ojos i::after{content:"";position:absolute;width:.3em;height:.3em;border-radius:50%;background:linear-gradient(135deg,#e1306c,#833ab4);top:.2em;left:.32em}

    /* ---------- vistas ---------- */
    .vista{position:relative;z-index:1;padding:calc(var(--sa-top) + 18px) 20px calc(var(--sa-bot) + 124px);
      max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
    .arriba{display:flex;align-items:center;gap:10px;min-height:44px}
    .arriba .wm{flex:1}
    h1.titulo{margin:0;min-height:44px;display:flex;align-items:center;font:700 27px/1.15 var(--marca);letter-spacing:-.02em}
    .sub{margin:-10px 4px 0;font-size:14px;line-height:1.45;color:var(--ink-2)}
    h2.cab{margin:0 4px -10px;font-size:20px;font-weight:700;letter-spacing:-.025em;display:flex;justify-content:space-between;align-items:baseline}
    h2.cab button{font-size:15px;font-weight:600;color:var(--rosa)}
    .nota{margin:-6px 6px 0;font-size:13px;line-height:1.45;color:var(--ink-2)}

    /* ---------- Hoy: la tarjeta grande ---------- */
    .heroe{position:relative;display:flex;flex-direction:column;justify-content:space-between;height:348px;padding:22px 22px 96px;
      border-radius:34px;background:var(--ig);color:#fff;overflow:hidden;text-align:left;
      box-shadow:0 24px 50px rgba(214,41,118,.3),inset 0 1px 0 rgba(255,255,255,.35)}
    .heroe::before{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;
      background:radial-gradient(closest-side,rgba(255,255,255,.28),transparent)}
    .heroe::after{content:"";position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(115deg,rgba(255,255,255,.30) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 70%,rgba(255,255,255,.12) 100%)}
    .heroe > *{position:relative;z-index:1}
    .heroe:active{transform:scale(.99)}
    .heroe-arriba{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;min-height:50px}
    .ficha{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:999px;min-width:0;
      background:rgba(255,255,255,.18);border:.5px solid rgba(255,255,255,.35);
      box-shadow:inset 1px 1px 0 rgba(255,255,255,.55),inset -1px -1px 0 rgba(255,255,255,.15),inset 0 0 12px rgba(255,255,255,.12);
      -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
    .ficha .av{width:34px;height:34px;font-size:13px;background:rgba(255,255,255,.9)!important;color:#A8215C!important}
    .ficha > div > b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ficha > div > span{display:block;font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ficha > div{min-width:0}
    .heroe .pega{flex:none}
    .heroe-cifra{font:800 112px/.85 var(--marca);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
    .heroe-cifra.largo{font-size:84px}
    .heroe-texto{margin-top:8px;font:700 19px/1.25 var(--marca);letter-spacing:-.015em}
    .cifras{position:relative;z-index:2;display:flex;gap:10px;margin-top:-110px;padding:0 12px}
    .cifras button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;padding:14px 12px;border-radius:24px;text-align:left;
      background:var(--c-bg);border:.5px solid var(--c-borde);box-shadow:var(--c-sombra);
      -webkit-backdrop-filter:var(--v-filtro);backdrop-filter:var(--v-filtro)}
    .cifras b{font:700 23px/1 var(--marca);letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cifras span{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
    .cifras .rosa b{color:var(--cifra-rosa)}
    .accion{display:flex;flex-direction:column;gap:12px}
    .estado-sync{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);padding:0 4px}
    .estado-sync i{width:7px;height:7px;border-radius:50%;background:var(--verde);box-shadow:0 0 8px rgba(52,210,123,.8);flex:none}
    .estado-sync.viejo i{background:var(--ambar);box-shadow:0 0 8px rgba(255,159,10,.7)}
    .estado-sync b{color:var(--ink);font-weight:600}

    /* ---------- filas ---------- */
    a.fila,.fila{display:flex;align-items:center;gap:12px;padding:12px 0;min-height:70px;color:inherit}
    .fila + .fila{border-top:.5px solid var(--sep)}
    a.fila:active{opacity:.6}
    .fila.arriba-al{align-items:flex-start}
    /* Sin foto, un circulo pastel que es siempre el mismo para la misma
       persona. En oscuro se invierte: fondo del tono fuerte, letra clara. */
    .av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;
      font-size:15px;font-weight:600;background:var(--a);color:var(--b)}
    :root[data-tema="oscuro"] .av{background:color-mix(in srgb,var(--b) 55%,#09090B);color:var(--a)}
    @media (prefers-color-scheme: dark){:root:not([data-tema="claro"]) .av{background:color-mix(in srgb,var(--b) 55%,#09090B);color:var(--a)}}
    .av img{width:100%;height:100%;object-fit:cover;display:block}
    /* El aro de las historias: solo en quien tiene algo que destacar. */
    .aro{display:block;width:52px;height:52px;border-radius:50%;padding:2.5px;background:var(--ig);flex:none}
    .aro > .av{width:100%;height:100%;border:2.5px solid var(--bg)}
    .quien{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
    .quien b{font-size:16px;font-weight:600;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .quien span{font-size:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .quien em{font-style:normal;font-size:13.5px;font-weight:500;color:var(--tinta,var(--lila));margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .derecha{display:flex;align-items:center;gap:6px;flex:none;color:var(--ink-2);font-size:13px}
    .derecha svg{width:7px;height:12px;opacity:.6}
    .lado{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex:none;padding-top:1px}
    .lado > span:first-child{font-size:12.5px;color:var(--ink-2)}
    .tag{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;background:var(--fill);font-size:11.5px;font-weight:600;color:var(--ink-2)}
    .rango{width:20px;text-align:center;font:700 14px var(--marca);color:var(--ink-3);flex:none}
    .vistas{text-align:right;flex:none}
    .vistas b{display:block;font:700 17px/1.1 var(--marca);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
    .vistas span{font-size:12px;color:var(--ink-2)}
    .vacia{display:flex;align-items:center;gap:12px;padding:14px 0}
    .vacia .ico{width:46px;height:46px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--ink-2);flex:none}
    .vacia .ico svg{width:20px;height:20px}
    .vacia b{display:block;font-size:16px;font-weight:600}
    .vacia span{display:block;font-size:13.5px;color:var(--ink-2);margin-top:2px}
    .etiqueta{margin:0 4px -12px;font-size:13px;font-weight:600;color:var(--ink-2)}

    /* ---------- segmentos y buscador ---------- */
    .segmentos{display:flex;gap:2px;padding:4px;border-radius:999px}
    .segmentos button{flex:1 1 0;height:40px;border-radius:999px;font-size:14px;font-weight:500;color:var(--ink-2);
      display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;min-width:0}
    .segmentos button em{font-style:normal;opacity:.6;font-variant-numeric:tabular-nums}
    .segmentos button.on{background:var(--on-bg);box-shadow:var(--on-sombra);color:var(--ink);font-weight:600}
    .buscar{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;background:var(--fill);color:var(--ink-2)}
    .buscar svg{width:19px;height:19px;flex:none}
    .buscar input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);font:15px var(--font)}
    .buscar input::placeholder{color:var(--ink-2)}

    /* ---------- Historias: la fila de caras ---------- */
    .caras{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 8px}
    .cara{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
    .cara .caja{position:relative;display:block}
    .cara .aro{width:70px;height:70px;padding:3px}
    .cara .aro > .av{border-width:3px;font-size:19px}
    .cara .n{position:absolute;right:-4px;bottom:-2px;min-width:24px;height:24px;padding:0 6px;border-radius:999px;background:#161616;color:#fff;
      font:700 11px/24px var(--marca);text-align:center;border:2px solid var(--bg)}
    .cara .nom{font-size:12.5px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* ---------- Historial ---------- */
    .panel{display:flex;flex-direction:column;gap:14px;padding:18px 18px 16px;border-radius:30px}
    .panel-cab{display:flex;align-items:baseline;gap:8px}
    .panel-cab b{font:700 30px/1 var(--marca);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
    .panel-cab span{font-size:14px;color:var(--ink-2)}
    .panel-cab .delta{margin-left:auto;display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;background:var(--fill);font-size:13px;font-weight:700;color:var(--ink-2)}
    .panel-cab .delta.menos{color:var(--rosa)} .panel-cab .delta.mas{color:#1f9d5b}
    .panel svg.linea{display:block;width:100%;height:96px}
    .panel-pie{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2)}
    .panel-tit{font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
    .panel-tit span{font-size:13px;font-weight:400;color:var(--ink-2)}
    /* La semana: lo que entro sube desde la linea del medio y lo que se fue
       baja. Una sola barra con el neto escondia los dias movidos. */
    .barras{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;height:112px;position:relative}
    .barras::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:.5px dashed var(--ink-3)}
    .barra{height:100%;display:flex;flex-direction:column}
    .barra .sube,.barra .baja{display:flex;justify-content:center;flex:1}
    .barra .sube{align-items:flex-end} .barra .baja{align-items:flex-start}
    .barra i{display:block;width:100%;max-width:24px;border-radius:7px}
    .barra .sube i{background:color-mix(in srgb,var(--verde) 75%,transparent)}
    .barra .baja i{background:color-mix(in srgb,var(--rosa) 70%,transparent)}
    .barra.hoy .sube i{background:var(--verde)} .barra.hoy .baja i{background:var(--rosa)}
    .dias{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;margin-top:-6px}
    .dias span{text-align:center;font-size:11.5px;font-weight:600;color:var(--ink-3)}
    .dias span.hoy{color:var(--ink)}
    .hist{display:flex;align-items:flex-end;gap:4px;height:90px}
    .hist i{flex:1;border-radius:5px 5px 2px 2px;background:var(--fill);min-height:4px}
    .hist i:last-child{background:var(--linea)}

    /* ---------- sin emparejar / esperando ---------- */
    .estado{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
      padding:calc(var(--sa-top) + 18px) 24px calc(var(--sa-bot) + 32px);max-width:520px;margin:0 auto}
    .estado .arriba{height:44px}
    .estado-medio{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;text-align:center}
    .icono{position:relative;width:128px;height:128px;border-radius:38px;background:var(--ig);display:flex;align-items:center;justify-content:center;gap:6px;
      box-shadow:inset 1.5px 1.5px 0 rgba(255,255,255,.5),inset -1px -1px 0 rgba(0,0,0,.1),0 24px 50px rgba(214,41,118,.35)}
    .icono::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(120deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%)}
    .icono i{position:relative;width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:4px}
    .icono i::after{content:"";width:17px;height:17px;border-radius:50%;background:#161616}
    .icono .pega{position:absolute;right:-64px;top:-18px;transform:rotate(7deg)}
    .estado h2{margin:0;font:700 28px/1.15 var(--marca);letter-spacing:-.02em;text-wrap:balance}
    .estado p{margin:12px auto 0;max-width:32ch;color:var(--ink-2);font-size:16px;line-height:1.5}
    .pasos{margin:0;padding:4px 18px;list-style:none;text-align:left;width:100%}
    .pasos li{display:flex;gap:12px;align-items:center;padding:13px 0;font-size:15px}
    .pasos li + li{border-top:.5px solid var(--sep)}
    .pasos li b{width:30px;height:30px;border-radius:50%;background:var(--ig);color:#fff;display:grid;place-items:center;font:700 13px var(--marca);flex:none}
    .punto-vivo{width:12px;height:12px;border-radius:50%;background:var(--verde);box-shadow:0 0 12px rgba(52,210,123,.8);animation:late 1.6s ease-in-out infinite}
    @keyframes late{50%{opacity:.35;transform:scale(.8)}}

    /* ---------- la barra de pestañas, en vidrio ---------- */
    .velo{position:fixed;left:0;right:0;bottom:0;height:150px;z-index:40;pointer-events:none;
      background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 0%,transparent) 0%,var(--bg) 70%)}
    .barra-tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sa-bot) + 14px);z-index:50;
      width:min(calc(100% - 28px),480px);display:flex;gap:2px;padding:5px;border-radius:999px;
      /* Capa propia: con backdrop-filter, Chromium repintaba solo el trozo
         que cambiaba y lo dejaba en blanco. */
      will-change:transform;isolation:isolate}
    .barra-tabs button{position:relative;z-index:1;flex:1 1 0;min-width:0;height:58px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
      font-size:11px;font-weight:600;letter-spacing:0;color:var(--ink-2);transition:color .25s}
    .barra-tabs button svg{width:22px;height:22px}
    .barra-tabs button.on{color:var(--ink)}
    /* La capsula activa es UNA pieza que se desliza, como en iOS. */
    .barra-tabs .capsula{position:absolute;z-index:0;top:5px;bottom:5px;left:5px;width:calc((100% - 10px - 8px) / 5);
      border-radius:999px;background:var(--on-bg);box-shadow:var(--on-sombra);transition:transform .42s cubic-bezier(.32,1.25,.46,1)}

    @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="fondo" aria-hidden="true"></div>

    <div class="velo" aria-hidden="true"></div>

      <button type="button" class="on" data-v="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7.5" cy="12" r="4.5"/><circle cx="16.5" cy="12" r="4.5"/><circle cx="8.8" cy="12" r="1" fill="currentColor"/><circle cx="17.8" cy="12" r="1" fill="currentColor"/></svg><span id="nHoy">Hoy</span></button>
      <button type="button" data-v="personas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.6"/><path d="M2.8 19.5c.6-3.4 3.1-5.5 6.2-5.5s5.6 2.1 6.2 5.5"/><path d="M15.5 4.8a3.4 3.4 0 0 1 0 6.4"/><path d="M18.2 14.3c1.7.8 2.8 2.6 3.1 5.2"/></svg><span id="nPer">Personas</span></button>

    </nav>
  </main>

  <script>
  (function () {
    'use strict';
    var ES = (navigator.language || 'es').toLowerCase().indexOf('es') === 0;
    var T = ES ? {

      seguidores: 'seguidores', seguidos: 'seguidos', nb_c: 'no te siguen',

      refrescar: 'Actualizar', ver: 'Ver todo',

      nb_pie: function (n) { return n === 1 ? '1 cuenta que sigues no te sigue. Tú decides.' : n + ' cuentas que sigues no te siguen. Tú decides a quién dejar.'; },
      his_sub: 'Quién ve más tus historias, según lo que ha ido guardando tu PC.',
      his_rank: 'Ranking', his_hist: 'Espectadores por revisión', vistas: 'vistas',
      caps: 'capturas', likes: 'me gusta', dias: 'días',
      unfollowed: 'Te dejó de seguir', followed: 'Empezó a seguirte',

      a_user: 'Cambió el usuario', a_story: 'Subió una historia',
      a_fadd: 'Empezó a seguir a ', a_frem: 'Dejó de seguir a ',

      just: 'ahora mismo',
      wTitle: 'Esperando a tu PC…',
      wBody: 'Abre Instagram en el ordenador con Ghoosted. En cuanto haga una revisión, lo verás aquí.',
      eTitle: 'Empareja tu móvil', ePega: 'sin contraseña',
      eBody: 'Ghoosted revisa tu Instagram desde el ordenador. Tu móvil ve lo mismo, cifrado.',
      p1: 'Abre Ghoosted en el ordenador.', p2: 'Ajustes → Emparejar móvil.', p3: 'Escanea el código con la cámara.',
      badKey: 'Enlace de emparejamiento no válido. Vuelve a escanear el código desde el PC.'
    } : {
      hoy: 'Today', personas: 'People', historias: 'Stories', actividad: 'Activity', historial: 'History',
      seguidores: 'followers', seguidos: 'following', nb_c: 'not back',
      h_1: 'person unfollowed you.', h_n: 'people unfollowed you.', h_0: 'nobody has unfollowed you.',
      p_1: 'left 💔', p_n: 'left 💔', p_0: 'all good ✨',
      unf: 'Unfollowed', neu: 'New', nb: 'Not back',
      refrescar: 'Refresh', ver: 'See all',
      al_dia: 'All up to date', viejo: 'PC off', revisado: 'checked',
      nota_pc: 'Checks run on your computer, with your own Instagram session. Here you see what it found, end-to-end encrypted.',
      g_hoy: 'Today', g_semana: 'This week', g_antes: 'Earlier',
      find_ph: 'Search by name or @username', find_none: 'Nobody matches that search.',
      v_new_t: 'Nobody new, yet', v_new_d: 'New followers show up here.',
      v_unf_t: 'Nobody has left', v_unf_d: 'If someone unfollows, you’ll see it here.',
      v_nb_t: 'Everyone follows you back', v_nb_d: 'Nobody you follow is missing.',
      v_act_t: 'No activity yet', v_act_d: 'Photo, name or bio changes from people you watch.',
      v_his_t: 'Nobody has watched your stories yet', v_his_d: 'Post one and once your PC checks it, they appear.',
      nb_pie: function (n) { return n === 1 ? '1 account you follow doesn’t follow you back.' : n + ' accounts you follow don’t follow you back. You decide.'; },
      his_sub: 'Who watches your stories most, from what your PC has saved.',
      his_rank: 'Ranking', his_hist: 'Viewers per check', vistas: 'views',
      caps: 'captures', likes: 'likes', dias: 'days',
      unfollowed: 'Unfollowed you', followed: 'Started following you',
      a_photo: 'Changed profile photo', a_bio: 'Changed bio', a_name: 'Changed name',
      a_user: 'Changed username', a_story: 'Posted a story',
      a_fadd: 'Started following ', a_frem: 'Unfollowed ',
      t_perfil: 'profile', t_foto: 'photo', t_hist: 'story', t_sigue: 'follows',
      r_tit: 'followers', r_semana: 'Last 7 days', r_mas: 'new', r_menos: 'left', r_hace: '7 d ago',
      just: 'just now',
      wTitle: 'Waiting for your PC…',
      wBody: 'Open Instagram on your computer with Ghoosted. As soon as it runs a check, it shows up here.',
      eTitle: 'Pair your phone', ePega: 'no password',
      eBody: 'Ghoosted checks your Instagram from your computer. Your phone sees the same, encrypted.',

      badKey: 'Invalid pairing link. Scan the code from your PC again.'
    };
    document.documentElement.lang = ES ? 'es' : 'en';

    /* El logo en letra, el mismo que en la web: la doble O son los ojos. */
    Array.prototype.forEach.call(document.querySelectorAll('[data-wm]'), function (el) {
      el.setAttribute('role', 'img'); el.setAttribute('aria-label', 'ghoosted');
      el.innerHTML = 'gh<span class="wm-ojos" aria-hidden="true"><i></i><i></i></span>sted';
    });

    function $(id) { return document.getElementById(id); }
    function texto(id, t) { var el = $(id); if (el) el.textContent = t; }
    texto('nHoy', T.hoy); texto('nPer', T.personas); texto('nHis', T.historias); texto('nAct', T.actividad); texto('nHist', T.historial);
    texto('tPer', T.personas); texto('tHis', T.historias); texto('tAct', T.actividad); texto('tHist', T.historial);
    texto('lFol', T.seguidores); texto('lFing', T.seguidos); texto('lNb', T.nb_c);
    texto('lRef', T.refrescar); texto('rVer', T.ver); texto('notaPc', T.nota_pc); texto('sHis', T.his_sub);
    texto('wTitle', T.wTitle); texto('wBody', T.wBody);
    texto('eTitle', T.eTitle); texto('eBody', T.eBody); texto('ePega', T.ePega);
    $('ePasos').innerHTML = [T.p1, T.p2, T.p3].map(function (p, i) {
      return '<li><b>' + (i + 1) + '</b><span>' + esc(p) + '</span></li>';
    }).join('');
    $('find').placeholder = T.find_ph;

    /* Tema. Sin eleccion guardada manda el telefono; en cuanto se pulsa, manda
       el boton y se recuerda. theme-color se actualiza para que la barra del
       navegador no se quede del color contrario. */
    var TEMA = 'ghosted_m_tema';
    (function () {
      var guardado = null;
      try { guardado = localStorage.getItem(TEMA); } catch (e) {}
      function oscuroAhora() {
        var t = document.documentElement.getAttribute('data-tema');
        return t === 'oscuro' || (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      }
      function pintar(t) {
        if (t) document.documentElement.setAttribute('data-tema', t);
        else document.documentElement.removeAttribute('data-tema');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', oscuroAhora() ? '#09090B' : '#F6F5F8');
      }
      pintar(guardado);
      $('tema').addEventListener('click', function () {
        var siguiente = oscuroAhora() ? 'claro' : 'oscuro';
        try { localStorage.setItem(TEMA, siguiente); } catch (e) {}
        pintar(siguiente);
      });
    })();

    /* ---------------- datos: emparejado, cifrado, sondeo ----------------
       Esta parte es la de antes, igual. Lo que cambia es como se pinta. */
    var STORE = 'ghosted_m';
    function b64urlToBytes(s) {
      s = String(s).replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      var bin = atob(s), out = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }
    function b64ToBytes(s) {
      var bin = atob(String(s)), out = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    // 1) Emparejar: #<canal>~<clave> desde el QR, se guarda y se quita de la URL.
    var hash = location.hash.replace(/^#/, '');
    if (hash.indexOf('~') !== -1) {
      var parts = hash.split('~');
      if (parts[0] && parts[1]) {
        try { localStorage.setItem(STORE, JSON.stringify({ channel: parts[0], key: parts[1] })); } catch (e) {}
      }
      history.replaceState(null, '', location.pathname);
    }
    /* #demo: datos de ejemplo, para enseñar la app sin emparejar. No toca el
       emparejamiento guardado ni habla con el servidor. */
    var DEMO = hash === 'demo';
    var pair = null;
    try { pair = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) {}

    function show(which) {
      $('dash').classList.toggle('hidden', which !== 'dash');
      $('waiting').classList.toggle('hidden', which !== 'wait');
      $('empty').classList.toggle('hidden', which !== 'empty');
    }

    async function decrypt(blobB64) {
      var raw = b64ToBytes(blobB64);
      var iv = raw.slice(0, 12), ct = raw.slice(12);
      var key = await crypto.subtle.importKey('raw', b64urlToBytes(pair.key), { name: 'AES-GCM' }, false, ['decrypt']);
      var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
      return JSON.parse(new TextDecoder().decode(pt));
    }

    /* ---------------- utilidades ---------------- */
    // Todo lo que viene de Instagram lo escribe un tercero: nombres, bios, @.
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
    /* Dos iniciales si hay nombre de dos palabras, como en los contactos del
       iPhone; si no, la primera letra del @. */
    function initials(p) {
      var w = String(p.full_name || '').replace(/[^\p{L}\p{N}\s]/gu, ' ').trim().split(/\s+/).filter(Boolean);
      if (w.length >= 2) return (w[0][0] + w[1][0]).toUpperCase();
      if (w.length === 1) return w[0][0].toUpperCase();
      return (String(p.username || '?').replace(/[^a-z0-9]/gi, '')[0] || '?').toUpperCase();
    }
    function num(n) { return Number(n || 0).toLocaleString(ES ? 'es-ES' : 'en-US'); }
    function ago(ts) {
      var s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
      if (s < 45) return T.just;
      var m = Math.floor(s / 60); if (m < 60) return (ES ? 'hace ' : '') + m + ' min' + (ES ? '' : ' ago');
      var h = Math.floor(m / 60); if (h < 24) return (ES ? 'hace ' : '') + h + ' h' + (ES ? '' : ' ago');
      var d = Math.floor(h / 24); return (ES ? 'hace ' : '') + d + ' d' + (ES ? '' : ' ago');
    }
    function corto(ts) {
      var s = Math.max(0, Math.floor((Date.now() - ts) / 1000)), m = Math.floor(s / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
      if (m < 1) return T.just; if (m < 60) return m + ' min'; if (h < 24) return h + ' h'; if (d < 7) return d + ' d';
      return Math.floor(d / 7) + (ES ? ' sem' : ' w');
    }
    function norm(t) { return String(t || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }
    function inicioDia(ts) { var d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }

    /* Pasteles del lienzo: fondo claro y letra del mismo tono, fuerte. Siempre
       el mismo para la misma persona. */
    var TONOS = [['#EAE2FD', '#5436AE'], ['#DDEBFF', '#27528F'], ['#DCF2E5', '#1B6640'],
                 ['#FFE8D4', '#91431A'], ['#FDE3EC', '#A8215C'], ['#F1E3FA', '#723390']];
    function tono(u) { var h = 0, s = String(u || ''); for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return TONOS[h % TONOS.length]; }
    function avatar(p, aro) {
      var t = tono(p.username), inner;
      // Solo picData: la CSP no deja pedir fotos a Instagram, y ademas esas
      // URLs caducan. Lo que no venga incrustado sale con las iniciales.
      if (p.picData) inner = '<span class="av"><img alt="" src="' + esc(p.picData) + '" onerror="this.remove()"></span>';
      else inner = '<span class="av" style="--a:' + t[0] + ';--b:' + t[1] + '">' + esc(initials(p)) + '</span>';
      return aro ? '<span class="aro">' + inner + '</span>' : inner;
    }
    var FLECHA = '<svg viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1 1 6 6-6 6"/></svg>';
    function perfil(u) { return u ? 'https://www.instagram.com/' + encodeURIComponent(u) + '/' : null; }

    /* Una fila. Toda la que tiene @ abre el perfil: en el movil eso abre la
       app de Instagram directamente. */
    function fila(p, o) {
      o = o || {};
      var url = perfil(p.username);
      var cls = 'fila' + (o.cambio ? ' arriba-al' : '');
      var abre = url ? '<a class="' + cls + '" href="' + esc(url) + '" target="_blank" rel="noopener">' : '<div class="' + cls + '">';
      var cierra = url ? '</a>' : '</div>';
      var nombre = p.full_name || (p.username ? p.username : '');
      var debajo = o.linea != null ? o.linea : (p.username ? '@' + p.username + (p.is_private ? (ES ? ' · privada' : ' · private') : '') : '');
      var cambio = o.cambio ? '<em' + (o.tinta ? ' style="--tinta:' + o.tinta + '"' : '') + '>' + esc(o.cambio) + '</em>' : '';
      var izq = o.rango != null ? '<span class="rango">' + o.rango + '</span>' : '';
      var der = o.der != null ? o.der : '<span class="derecha">' + (p.ts ? esc(corto(p.ts)) : '') + (url ? FLECHA : '') + '</span>';
      return abre + izq + avatar(p, o.aro) + '<span class="quien"><b>' + esc(nombre) + '</b>' +
        (debajo ? '<span>' + esc(debajo) + '</span>' : '') + cambio + '</span>' + der + cierra;
    }
    var ICO = {
      nuevo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10" cy="8" r="4"/><path d="M3.5 20c0-3.6 2.9-6 6.5-6M19 14v6M16 17h6"/></svg>',
      fuera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10" cy="8" r="4"/><path d="M3.5 20c0-3.6 2.9-6 6.5-6M16 17h6"/></svg>',
      ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></svg>',
      pulso: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-6 5 12 2.5-6h4"/></svg>',
      his: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.6"/><circle cx="12" cy="12" r="4"/></svg>',
      buscar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>'
    };
    function vacia(ico, t, d) {
      return '<div class="vacia"><span class="ico">' + ico + '</span><div><b>' + esc(t) + '</b>' + (d ? '<span>' + esc(d) + '</span>' : '') + '</div></div>';
    }

    /* ---------------- estado ---------------- */
    var datos = null, vista = 'hoy', seg = 'unfollow', busqueda = '';
    var VISTAS = ['hoy', 'personas', 'historias', 'actividad', 'historial'];

    /* Los siete ultimos dias, con los que entraron y los que se fueron cada
       dia. Sale de las propias listas —cada entrada lleva su hora— asi que el
       PC no tiene que mandar nada nuevo para esto. */
    function semana(d) {
      var tabs = d.tabs || {}, hoy = inicioDia(Date.now()), dias = [];
      for (var i = 6; i >= 0; i--) dias.push({ t: hoy - i * 864e5, mas: 0, menos: 0 });
      function cuenta(lista, campo) {
        (lista || []).forEach(function (e) {
          if (!e.ts) return;
          var k = Math.round((inicioDia(e.ts) - dias[0].t) / 864e5);
          if (k >= 0 && k < 7) dias[k][campo]++;
        });
      }
      cuenta(tabs.new, 'mas'); cuenta(tabs.unfollow, 'menos');
      return dias;
    }

    function pintarHoy() {
      var d = datos, tabs = d.tabs || {}, c = d.counts || {};
      var unf = (tabs.unfollow || []).slice().sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
      var n = unf.length;

      // La tarjeta grande: cuantos se fueron, y la cara del ultimo.
      var cifra = $('hCifra');
      cifra.textContent = num(n);
      cifra.classList.toggle('largo', String(n).length > 2);
      texto('hTexto', n === 1 ? T.h_1 : n ? T.h_n : T.h_0);
      texto('hPega', n === 1 ? T.p_1 : n ? T.p_n : T.p_0);
      var ult = unf[0], ficha = $('hFicha');
      ficha.hidden = !ult;
      if (ult) {
        ficha.innerHTML = avatar(ult) + '<div><b>' + esc(ult.full_name || ult.username) + '</b><span>' +
          esc('@' + ult.username + (ult.ts ? ' · ' + ago(ult.ts) : '')) + '</span></div>';
      }

      texto('cFol', c.followers != null ? num(c.followers) : '—');
      texto('cFing', c.following != null ? num(c.following) : '—');
      texto('cNb', num(c.notback != null ? c.notback : (tabs.notback || []).length));

      // Nuevos: los cinco mas recientes.
      var neu = (tabs.new || []).slice().sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
      texto('nuevosTit', T.neu + ' · ' + num(neu.length));
      $('rVer').hidden = neu.length <= 5;
      $('recientes').innerHTML = neu.length ? neu.slice(0, 5).map(function (p) { return fila(p, { aro: true }); }).join('')
        : vacia(ICO.nuevo, T.v_new_t, T.v_new_d);
    }

    function pintarPersonas() {
      var tabs = datos.tabs || {}, c = datos.counts || {};
      var defs = [['unfollow', T.unf, (tabs.unfollow || []).length], ['new', T.neu, (tabs.new || []).length],
                  ['notback', T.nb, c.notback != null ? c.notback : (tabs.notback || []).length]];
      $('segmentos').innerHTML = defs.map(function (s) {
        return '<button type="button" data-s="' + s[0] + '" aria-pressed="' + (s[0] === seg) + '"' + (s[0] === seg ? ' class="on"' : '') + '>' +
          esc(s[1]) + '<em>' + num(s[2]) + '</em></button>';
      }).join('');

      var items = (tabs[seg] || []).slice();
      if (busqueda) {
        var q = norm(busqueda);
        items = items.filter(function (e) { return norm(e.username).indexOf(q) >= 0 || norm(e.full_name).indexOf(q) >= 0; });
      }
      var caja = $('listaPer');
      if (!items.length) {
        caja.innerHTML = '<div class="lista">' + (busqueda ? vacia(ICO.buscar, T.find_none)
          : seg === 'unfollow' ? vacia(ICO.fuera, T.v_unf_t, T.v_unf_d)
          : seg === 'new' ? vacia(ICO.nuevo, T.v_new_t, T.v_new_d) : vacia(ICO.ok, T.v_nb_t, T.v_nb_d)) + '</div>';
        return;
      }
      var opc = seg === 'new' ? { aro: true } : {};

      // "No te siguen" no tiene hora: va entero, en un solo bloque.
      if (seg === 'notback') {
        var total = c.notback != null ? c.notback : items.length;
        caja.innerHTML = '<div class="lista">' + items.map(function (p) { return fila(p, opc); }).join('') + '</div>' +
          (busqueda ? '' : '<p class="nota">' + esc(T.nb_pie(total)) + '</p>');
        return;
      }
      items.sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
      /* Agrupado por cuando, como las notificaciones del sistema. */
      var hoy = inicioDia(Date.now()), sem = hoy - 6 * 864e5, grupos = [[T.g_hoy, []], [T.g_semana, []], [T.g_antes, []]];
      items.forEach(function (p) { var t = p.ts || 0; (t >= hoy ? grupos[0] : t >= sem ? grupos[1] : grupos[2])[1].push(p); });
      caja.innerHTML = grupos.filter(function (g) { return g[1].length; }).map(function (g) {
        return '<div class="etiqueta">' + esc(g[0]) + '</div><div class="lista">' + g[1].map(function (p) { return fila(p, opc); }).join('') + '</div>';
      }).join('');
    }

    function pintarHistorias() {
      var st = (datos.tabs || {}).stories || [], hist = datos.history || [];
      var html = '';
      if (!st.length) html += '<div class="lista">' + vacia(ICO.his, T.v_his_t, T.v_his_d) + '</div>';
      else {
        // Arriba las caras, como la fila de historias de Instagram; el numero
        // es cuantas han visto.
        html += '<div class="caras">' + st.slice(0, 8).map(function (e) {
          var url = perfil(e.username);
          return '<a class="cara" href="' + esc(url || '#') + '" target="_blank" rel="noopener"><span class="caja">' + avatar(e, true) +
            (e.slides ? '<span class="n">' + esc(num(e.slides)) + '</span>' : '') + '</span><span class="nom">' + esc(e.username || e.full_name) + '</span></a>';
        }).join('') + '</div>';
        html += '<h2 class="cab"><span>' + esc(T.his_rank) + '</span></h2><div class="lista">' + st.map(function (e, i) {
          var meta = [];
          if (e.captures) meta.push(e.captures + ' ' + T.caps);
          if (e.likes) meta.push(e.likes + ' ' + T.likes);
          if (e.days) meta.push(e.days + ' ' + T.dias);
          return fila(e, {
            rango: i + 1, linea: meta.join(' · ') || (e.username ? '@' + e.username : ''),
            der: '<span class="vistas"><b>' + num(e.slides) + '</b><span>' + esc(T.vistas) + '</span></span>'
          });
        }).join('') + '</div>';
      }
      if (hist.length > 1) {
        var h = hist.slice(0, 24).reverse(), tope = Math.max(1, Math.max.apply(null, h.map(function (x) { return x.viewers || 0; })));
        html += '<div class="panel vidrio"><div class="panel-tit">' + esc(T.his_hist) + '<span>' + esc(num(h[h.length - 1].viewers)) + ' ' + esc(T.vistas) + '</span></div><div class="hist">' +
          h.map(function (x) { return '<i style="height:' + Math.max(5, (x.viewers || 0) / tope * 100) + '%" title="' + (x.viewers || 0) + '"></i>'; }).join('') +
          '</div><div class="panel-pie"><span>' + esc(ago(h[0].ts)) + '</span><span>' + esc(ago(h[h.length - 1].ts)) + '</span></div></div>';
      }
      $('listaHis').innerHTML = html;
    }

    function actLabel(e) {
      var t = e.target && e.target.username ? '@' + e.target.username : '';
      var de = e.from != null && e.to != null ? ' · ' + e.from + ' → ' + e.to : '';
      return (({ unfollow: T.unfollowed, new: T.followed, photo: T.a_photo, bio: T.a_bio, name: T.a_name,
                username: T.a_user, story: T.a_story, follow_add: T.a_fadd + t, follow_rem: T.a_frem + t })[e.type] || e.type || '') + de;
    }
    function actTag(t) {
      return ({ photo: T.t_foto, story: T.t_hist, follow_add: T.t_sigue, follow_rem: T.t_sigue, new: T.t_sigue, unfollow: T.t_sigue })[t] || T.t_perfil;
    }
    function actTinta(t) {
      return ({ unfollow: 'var(--rosa)', follow_rem: 'var(--rosa)', new: '#1f9d5b', follow_add: '#1f9d5b' })[t] || '';
    }
    function pintarActividad() {
      var a = ((datos.tabs || {}).activity || []).slice().sort(function (x, y) { return (y.ts || 0) - (x.ts || 0); });
      $('listaAct').innerHTML = '<div class="lista">' + (a.length ? a.map(function (e) {
        return fila(e, {
          cambio: actLabel(e), tinta: actTinta(e.type), aro: e.type === 'story',
          der: '<span class="lado"><span>' + (e.ts ? esc(corto(e.ts)) : '') + '</span><span class="tag">' + esc(actTag(e.type)) + '</span></span>'
        });
      }).join('') : vacia(ICO.pulso, T.v_act_t, T.v_act_d)) + '</div>';
    }

    /* La linea de seguidores de la semana. El PC no guarda cuantos tenias
       cada dia, pero si quien entro y quien se fue y cuando: andando hacia
       atras desde la cifra de hoy sale la de cada dia. */
    function pintarHistorial() {
      var d = datos, c = d.counts || {}, dias = semana(d);
      var mas = dias.reduce(function (a, x) { return a + x.mas; }, 0);
      var menos = dias.reduce(function (a, x) { return a + x.menos; }, 0);
      var neto = mas - menos, html = '';

      if (c.followers != null) {
        var pts = [], v = c.followers;
        for (var i = 6; i >= 0; i--) { pts[i] = v; v -= dias[i].mas - dias[i].menos; }
        var inicio = v, serie = [inicio].concat(pts);
        var lo = Math.min.apply(null, serie), hi = Math.max.apply(null, serie), rango = Math.max(1, hi - lo);
        var xy = serie.map(function (y, k) { return [k / (serie.length - 1) * 300, 14 + (1 - (y - lo) / rango) * 64]; });
        var dl = 'M' + xy.map(function (p) { return p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' L');
        var cls = neto < 0 ? ' menos' : neto > 0 ? ' mas' : '';
        html += '<div class="panel vidrio"><div class="panel-cab"><b>' + num(c.followers) + '</b><span>' + esc(T.r_tit) + '</span>' +
          '<span class="delta' + cls + '">' + (neto > 0 ? '+' : neto < 0 ? '−' : '±') + num(Math.abs(neto)) + '</span></div>' +
          '<svg class="linea" viewBox="0 0 300 96" preserveAspectRatio="none" role="img" aria-label="' + esc(num(inicio) + ' → ' + num(c.followers)) + '">' +
          '<defs><linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="#F0507A"/><stop offset="1" stop-color="#6E4BE0"/></linearGradient>' +
          '<linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D62976" stop-opacity=".22"/><stop offset="1" stop-color="#D62976" stop-opacity="0"/></linearGradient></defs>' +
          '<path d="' + dl + ' L300 96 L0 96 Z" fill="url(#gf)"/><path d="' + dl + '" fill="none" stroke="url(#gl)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>' +
          '<div class="panel-pie"><span>' + esc(T.r_hace) + '</span><span>' + esc(T.hoy.toLowerCase()) + '</span></div></div>';
      }

      /* Barras que suben (entraron) y bajan (se fueron) desde una linea
         central. Escala comun a las dos mitades para que se comparen. */
      var tope = Math.max(1, dias.reduce(function (a, x) { return Math.max(a, x.mas, x.menos); }, 0));
      var fmt = ES ? ['D', 'L', 'M', 'X', 'J', 'V', 'S'] : ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
      html += '<div class="panel vidrio"><div class="panel-tit">' + esc(T.r_semana) + '<span>+' + mas + ' ' + esc(T.r_mas) + ' · ' + menos + ' ' + esc(T.r_menos) + '</span></div>' +
        '<div class="barras">' + dias.map(function (x, i) {
          return '<div class="barra' + (i === 6 ? ' hoy' : '') + '" title="+' + x.mas + ' / −' + x.menos + '">' +
            '<div class="sube"><i style="height:' + (x.mas ? Math.max(8, x.mas / tope * 100) : 0) + '%"></i></div>' +
            '<div class="baja"><i style="height:' + (x.menos ? Math.max(8, x.menos / tope * 100) : 0) + '%"></i></div></div>';
        }).join('') + '</div><div class="dias">' + dias.map(function (x, i) {
          return '<span' + (i === 6 ? ' class="hoy"' : '') + '>' + fmt[new Date(x.t).getDay()] + '</span>';
        }).join('') + '</div></div>';
      $('listaHist').innerHTML = html;
    }

    function pintar() {
      if (!datos) return;
      ({ hoy: pintarHoy, personas: pintarPersonas, historias: pintarHistorias, actividad: pintarActividad, historial: pintarHistorial })[vista]();
    }

    function irA(v) {
      vista = v;
      VISTAS.forEach(function (k) { $('v-' + k).classList.toggle('hidden', k !== v); });
      Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.classList.toggle('on', b.dataset.v === v); });
      // Cada boton mide un quinto y entre ellos hay 2px de hueco.
      $('capsula').style.transform = 'translateX(calc(' + VISTAS.indexOf(v) + ' * (100% + 2px)))';
      window.scrollTo(0, 0);
      pintar();
    }
    function aPersonas(s) { seg = s; busqueda = ''; $('find').value = ''; irA('personas'); }

    $('tabs').addEventListener('click', function (e) { var b = e.target.closest('button[data-v]'); if (b) irA(b.dataset.v); });
    // La tarjeta grande lleva a quien se fue; las cifras, a su lista.
    $('heroe').addEventListener('click', function () { aPersonas('unfollow'); });
    document.querySelector('.cifras').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-ir]'); if (b) aPersonas(b.dataset.ir);
    });
    $('rVer').addEventListener('click', function () { aPersonas('new'); });
    $('segmentos').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-s]'); if (!b) return;
      // Al cambiar de lista se quita el filtro: si no, se ve vacia y parece
      // que no hay nadie, cuando lo que hay es una busqueda puesta.
      seg = b.dataset.s; busqueda = ''; $('find').value = ''; pintarPersonas();
    });
    $('find').addEventListener('input', function () { busqueda = this.value; pintarPersonas(); });

    function render(d) {
      datos = d;
      show('dash');
      var viejo = Date.now() - (d.ts || 0) > 30 * 60000;
      $('sync').classList.toggle('viejo', viejo);
      $('syncTxt').innerHTML = '<b>' + esc(viejo ? T.viejo : T.al_dia) + '</b> · ' + esc(T.revisado + ' ' + ago(d.ts || Date.now()));
      pintar();
    }

    /* ---------------- arranque ---------------- */
    if (DEMO) {
      /* Datos de ejemplo. Las horas se calculan desde ahora para que la
         grafica de la semana tenga algo que enseñar el dia que se abra. */
      var H = 36e5, ahora = Date.now();
      function p(u, n, h, priv) { return { username: u, full_name: n, ts: ahora - h * H, is_private: !!priv }; }
      render({
        v: 1, ts: ahora - 3 * 60000,
        counts: { followers: 475, following: 292, notback: 4 },
        tabs: {
          unfollow: [p('diaayee_', 'Diaye', 96)],
          new: [p('sofi.palms', 'sofi 🌴', 5), p('mgidrewicz', 'Marcel Gidrewicz', 30, true), p('ana_bcn', 'Ana 🌙', 50)],
          notback: [p('braedencarterrr', 'Braeden Carter'), p('danieldrh_', ''), p('evaeliades', 'Eva 💋'), p('p.aaquiiless', '', 0, true)]
            .map(function (x) { delete x.ts; return x; }),
          activity: [
            { type: 'name', username: 'evaeliades', full_name: 'Eva 💋', from: 'Evaeliades', to: 'Eva 💋', ts: ahora - 1 * H },
            { type: 'photo', username: 'miguelrami_04', full_name: 'MIGUEL RAMI', is_private: true, ts: ahora - 1 * H },
            { type: 'story', username: 'sofi.palms', full_name: 'sofi 🌴', ts: ahora - 2 * H },
            { type: 'follow_add', username: 'ana_bcn', full_name: 'Ana 🌙', target: { username: 'dario.fx' }, ts: ahora - 11 * H },
