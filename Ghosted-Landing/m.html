<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Ghoosted</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ghoosted">
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="apple-touch-icon" href="assets/icon.png">
  <link rel="manifest" href="m.webmanifest">
  <style>
    /* ======================================================================
       EL ESPEJO DEL MOVIL
       ----------------------------------------------------------------------
       Lo que el PC ya ha revisado, en el telefono. Nada de esto habla con
       Instagram: el PC cifra lo que ve, lo deja en /api/m/push, y aqui se
       descifra con una clave que solo viaja en el QR. El servidor guarda un
       bloque que no sabe leer.

       El diseño sigue a iOS a proposito: colores de sistema, titulos grandes,
       listas agrupadas con esquinas redondas, y la barra de pestañas abajo
       en vidrio. El degradado de Instagram va solo donde significa algo —el
       aro de las fotos, la cifra de la semana, el boton principal— y en
       ningun sitio de relleno.

       La CSP de la web manda aqui tambien: nada de fuentes de fuera
       (font-src 'self') y nada de fotos de Instagram (img-src 'self' data:).
       Por eso la letra es la del sistema —que en un iPhone ES la de Apple— y
       las caras llegan incrustadas desde el PC.
       ====================================================================== */
    :root{
      --bg:#000; --card:#1c1c1e; --card-2:#2c2c2e; --fill:rgba(118,118,128,.24);
      --ink:#fff; --ink-2:rgba(235,235,245,.6); --ink-3:rgba(235,235,245,.3);
      --sep:rgba(84,84,88,.55);
      --red:#ff453a; --green:#30d158; --blue:#0a84ff;
      --glass:rgba(30,30,32,.62); --glass-edge:rgba(255,255,255,.12); --glass-hi:rgba(255,255,255,.14);
      --ig:linear-gradient(45deg,#feda75 0%,#fa7e1e 25%,#d62976 50%,#962fbf 75%,#4f5bd5 100%);
      --ig-2:linear-gradient(90deg,#d62976,#962fbf 55%,#4f5bd5);
      --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
      --sa-top:env(safe-area-inset-top,0px); --sa-bot:env(safe-area-inset-bottom,0px);
    }
    @media (prefers-color-scheme: light){
      :root:not([data-tema="oscuro"]){
        --bg:#f2f2f7; --card:#fff; --card-2:#f2f2f7; --fill:rgba(118,118,128,.12);
        --ink:#000; --ink-2:rgba(60,60,67,.6); --ink-3:rgba(60,60,67,.3);
        --sep:rgba(60,60,67,.18);
        --red:#ff3b30; --green:#34c759; --blue:#007aff;
        --glass:rgba(249,249,251,.72); --glass-edge:rgba(0,0,0,.06); --glass-hi:rgba(255,255,255,.9);
      }
    }
    :root[data-tema="claro"]{
      --bg:#f2f2f7; --card:#fff; --card-2:#f2f2f7; --fill:rgba(118,118,128,.12);
      --ink:#000; --ink-2:rgba(60,60,67,.6); --ink-3:rgba(60,60,67,.3);
      --sep:rgba(60,60,67,.18);
      --red:#ff3b30; --green:#34c759; --blue:#007aff;
      --glass:rgba(249,249,251,.72); --glass-edge:rgba(0,0,0,.06); --glass-hi:rgba(255,255,255,.9);
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;background:var(--bg);color:var(--ink)}
    body{font:17px/1.35 var(--font);letter-spacing:-.022em;-webkit-font-smoothing:antialiased;
      min-height:100vh;overscroll-behavior-y:none}
    button{font:inherit;color:inherit;letter-spacing:inherit}
    .hidden{display:none!important}
    [hidden]{display:none!important}

    /* ---------- el halo de Instagram, arriba de "Hoy" ----------
       Suave y solo en la primera pantalla. Es lo que hace que abrir la app
       se vea de Instagram sin llenarlo todo de degradado. */
    .halo{position:absolute;inset:0 0 auto 0;height:420px;pointer-events:none;z-index:0;
      background:
        radial-gradient(60% 55% at 12% 0%,rgba(250,126,30,.40),transparent 70%),
        radial-gradient(55% 50% at 90% 6%,rgba(79,91,213,.42),transparent 70%),
        radial-gradient(70% 60% at 50% 30%,rgba(214,41,118,.36),transparent 72%);
      -webkit-mask-image:linear-gradient(#000 35%,transparent);mask-image:linear-gradient(#000 35%,transparent)}
    :root[data-tema="claro"] .halo{opacity:.75}
    @media (prefers-color-scheme: light){:root:not([data-tema="oscuro"]) .halo{opacity:.75}}

    /* ---------- vistas ---------- */
    .vista{position:relative;padding:calc(var(--sa-top) + 10px) 16px calc(var(--sa-bot) + 110px);
      max-width:560px;margin:0 auto}
    /* El halo NO entra en esta regla: es el unico hijo que tiene que ir en
       absolute, detras. Con un ".vista > *" a secas se volvia relative, ocupaba
       sus 420px en el flujo, y la cabecera de Hoy empezaba a media pantalla
       con un borron encima. */
    .vista > :not(.halo){position:relative;z-index:1}
    .arriba{display:flex;align-items:center;gap:10px;min-height:44px}
    .arriba .marca{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
    .logo{width:32px;height:32px;border-radius:50%;background:var(--ig);display:grid;place-items:center;flex:none;
      box-shadow:0 4px 14px rgba(214,41,118,.35)}
    .logo svg{width:20px;height:20px}
    .arriba .marca b{font-size:17px;font-weight:600}
    .redondo{width:36px;height:36px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;
      background:var(--fill);color:var(--ink)}
    .redondo svg{width:18px;height:18px}
    .redondo:active{transform:scale(.92)}
    .redondo.gira svg{animation:gira .8s linear infinite}
    @keyframes gira{to{transform:rotate(360deg)}}
    h1.titulo{margin:6px 4px 14px;font-size:34px;font-weight:700;letter-spacing:.012em;line-height:1.1}

    /* ---------- Hoy ---------- */
    .heroe{text-align:center;padding:30px 0 24px}
    .heroe .et{font-size:15px;font-weight:500;color:var(--ink-2)}
    .heroe .cifra{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:4px 0 16px}
    .heroe .cifra b{font-size:76px;font-weight:700;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
    .heroe .cifra span{font-size:22px;font-weight:600;letter-spacing:-.02em}
    .heroe .cifra b.menos{color:var(--red)}
    .pildora{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:99px;font-size:13px;font-weight:500;
      background:var(--glass);border:.5px solid var(--glass-edge);
      -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
    .pildora i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 25%,transparent)}
    .pildora.viejo i{background:#ff9f0a;box-shadow:0 0 0 3px rgba(255,159,10,.25)}

    .tarjeta{background:var(--card);border-radius:22px;overflow:hidden}
    .tres{display:grid;grid-template-columns:repeat(3,1fr);padding:16px 4px}
    .tres button{border:0;background:none;padding:2px 4px;text-align:center;cursor:pointer}
    .tres button + button{border-left:.5px solid var(--sep)}
    .tres b{display:block;font-size:26px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
    .tres span{font-size:12.5px;color:var(--ink-2);font-weight:500}
    .tres .r b{color:var(--red)} .tres .v b{color:var(--green)}

    /* La grafica de la semana: siete columnas, y en cada una lo que entro
       sube desde la linea del medio y lo que se fue baja. Una sola barra con
       el neto escondia los dias movidos —entran cinco, se van cinco, sale
       cero— y justo esos son los que interesan.

       Clases propias y no un .graf generico: en el prediseño habia dos
       reglas .graf y la segunda pisaba a la primera, asi que las barras se
       apilaban en dos columnas y se salian de la tarjeta. */
    .semana{border-top:.5px solid var(--sep);padding:16px 16px 12px}
    .semana-cab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
    .semana-cab b{font-size:15px;font-weight:600}
    .semana-cab span{font-size:13px;color:var(--ink-2)}
    .barras{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;height:112px;align-items:end;position:relative}
    .barras::before{content:"";position:absolute;left:0;right:0;bottom:50%;border-top:.5px dashed var(--sep)}
    .barra{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center}
    .barra .sube,.barra .baja{display:flex;align-items:flex-end;justify-content:center;flex:1}
    .barra .baja{align-items:flex-start}
    /* Sin min-height: un dia sin bajas dejaba una raya roja de 4px sobre la
       linea del medio, como si alguien se hubiera ido. Lo que es cero no se
       pinta; lo que no es cero ya sale con un minimo desde el script. */
    .barra i{display:block;width:100%;max-width:26px;border-radius:7px;background:var(--fill)}
    .barra .sube i{background:color-mix(in srgb,var(--green) 70%,transparent)}
    .barra .baja i{background:color-mix(in srgb,var(--red) 70%,transparent)}
    .barra.hoy .sube i{background:var(--ig-2)}
    .barra.hoy .baja i{background:var(--red)}
    .dias{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;margin-top:8px}
    .dias span{text-align:center;font-size:11.5px;font-weight:500;color:var(--ink-3);text-transform:uppercase}
    .dias span.hoy{color:var(--ink);font-weight:700}

    .seccion{margin:26px 4px 8px;display:flex;justify-content:space-between;align-items:baseline}
    .seccion b{font-size:20px;font-weight:700;letter-spacing:-.01em}
    .seccion button{border:0;background:none;color:var(--blue);font-size:15px;cursor:pointer;padding:0}
    .nota{margin:10px 6px 0;font-size:13px;color:var(--ink-3);line-height:1.4;text-align:center}

    /* ---------- listas agrupadas, al estilo de Ajustes ---------- */
    .grupo{background:var(--card);border-radius:14px;overflow:hidden}
    .grupo + .etiqueta{margin-top:22px}
    .etiqueta{margin:0 20px 7px;font-size:13px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.01em}
    a.fila,.fila{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:64px;color:inherit;text-decoration:none;position:relative}
    .fila + .fila::before{content:"";position:absolute;top:0;left:74px;right:0;border-top:.5px solid var(--sep)}
    a.fila:active{background:var(--fill)}
    .av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;
      color:#fff;font-size:17px;font-weight:600}
    .av img{width:100%;height:100%;object-fit:cover;display:block}
    /* El aro de las historias. Solo en quien tiene algo que destacar: los que
       mas ven tus historias y lo recien pasado. Puesto en todos no dice nada. */
    .aro{padding:2.5px;background:var(--ig)}
    .aro > .av{width:100%;height:100%;border:2.5px solid var(--card)}
    .aro-caja{width:50px;height:50px;border-radius:50%;flex:none}
    .quien{flex:1;min-width:0}
    .quien b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .quien span{display:block;font-size:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .quien em{display:flex;align-items:center;gap:6px;font-style:normal;font-size:13px;color:var(--ink-2);margin-top:1px}
    .quien em::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--punto,var(--ink-3));flex:none}
    .derecha{display:flex;align-items:center;gap:6px;flex:none;color:var(--ink-3);font-size:14px}
    .derecha svg{width:8px;height:14px}
    .rango{width:22px;text-align:center;font-size:15px;font-weight:700;color:var(--ink-3);flex:none;font-variant-numeric:tabular-nums}
    .vistas{text-align:right;flex:none}
    .vistas b{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
    .vistas span{font-size:12px;color:var(--ink-2)}

    /* ---------- Personas: control segmentado y buscador de iOS ---------- */
    .segmentos{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px;border-radius:10px;background:var(--fill);margin:0 0 12px}
    .segmentos button{border:0;border-radius:8px;padding:7px 2px;background:none;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap}
    .segmentos button.on{background:var(--card);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 .5px 1px rgba(0,0,0,.1)}
    :root:not([data-tema="claro"]) .segmentos button.on{background:#636366}
    @media (prefers-color-scheme: light){:root:not([data-tema="oscuro"]) .segmentos button.on{background:#fff}}
    .segmentos em{font-style:normal;color:var(--ink-2);font-weight:500;margin-left:4px;font-variant-numeric:tabular-nums}
    .buscar{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:0 10px;height:38px;margin:0 0 18px}
    .buscar svg{width:16px;height:16px;color:var(--ink-2);flex:none}
    .buscar input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--ink);font:17px var(--font);letter-spacing:-.02em}
    .buscar input::placeholder{color:var(--ink-2)}

    /* ---------- Historial: barras pequeñas por revision ---------- */
    .hist{display:flex;align-items:flex-end;gap:4px;height:90px;padding:16px 16px 12px}
    .hist i{flex:1;border-radius:4px 4px 2px 2px;background:var(--fill);min-height:4px}
    .hist i:last-child{background:var(--ig-2)}
    .hist-pie{display:flex;justify-content:space-between;padding:0 16px 14px;font-size:12px;color:var(--ink-3)}

    /* ---------- estados: sin emparejar, esperando, vacio ---------- */
    .estado{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
      padding:calc(var(--sa-top) + 24px) 32px calc(var(--sa-bot) + 24px);position:relative;overflow:hidden}
    .estado > :not(.halo){position:relative;z-index:1}
    .estado .logo{width:84px;height:84px;margin-bottom:24px}
    .estado .logo svg{width:50px;height:50px}
    .estado h2{margin:0 0 10px;font-size:28px;font-weight:700;letter-spacing:.01em}
    .estado p{margin:0;max-width:34ch;color:var(--ink-2);font-size:16px;line-height:1.45}
    .pasos{margin:28px 0 0;padding:0;list-style:none;text-align:left;width:100%;max-width:340px}
    .pasos li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;font-size:15px;color:var(--ink-2)}
    .pasos li + li{border-top:.5px solid var(--sep)}
    .pasos li b{width:26px;height:26px;border-radius:50%;background:var(--fill);color:var(--ink);display:grid;place-items:center;font-size:14px;flex:none}
    .vacio{padding:44px 24px;text-align:center;color:var(--ink-2);font-size:15px}
    .vacio svg{width:38px;height:38px;color:var(--ink-3);display:block;margin:0 auto 10px}
    .punto-vivo{width:10px;height:10px;border-radius:50%;background:var(--green);margin:0 auto 18px;animation:late 1.6s ease-in-out infinite}
    @keyframes late{50%{opacity:.35;transform:scale(.8)}}

    /* ---------- la barra de pestañas, en vidrio ---------- */
    .barra-tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sa-bot) + 10px);z-index:50;
      width:min(calc(100% - 24px),440px);display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:6px;border-radius:99px;
      background:var(--glass);border:.5px solid var(--glass-edge);
      -webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);
      box-shadow:inset 0 1px 0 var(--glass-hi),0 10px 30px -10px rgba(0,0,0,.45);
      /* Capa propia. Sin esto, al cambiar de pestaña Chromium repintaba solo
         el trozo de los botones que cambiaban y, por el backdrop-filter, lo
         dejaba del color del fondo y sin iconos: media barra en blanco. */
      will-change:transform;isolation:isolate}
    .barra-tabs button{border:0;background:none;border-radius:99px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
      font-size:10.5px;font-weight:600;letter-spacing:0;color:var(--ink-2);cursor:pointer}
    .barra-tabs button svg{width:24px;height:24px}
    .barra-tabs button{position:relative;z-index:1}
    .barra-tabs button.on{color:var(--ink)}
    /* La capsula de la pestaña activa es UNA pieza que se desliza, como en la
       barra de iOS, y no un fondo que se enciende y se apaga en cada boton.
       Ademas de verse mejor, se mueve con transform, que no repinta: con el
       fondo por boton, Chromium repintaba solo el trozo que cambiaba y, por el
       backdrop-filter, lo dejaba en blanco y sin iconos. */
    .barra-tabs .capsula{position:absolute;z-index:0;top:6px;bottom:6px;left:6px;
      width:calc((100% - 12px - 6px) / 4);border-radius:99px;background:var(--fill);
      transition:transform .42s cubic-bezier(.32,1.25,.46,1)}
    .barra-tabs .fan{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.8px solid currentColor}
    .barra-tabs .fan svg{width:15px;height:15px}
    .barra-tabs .fan ellipse{display:none}
    /* Apagado, el fantasma va del color del texto. El path trae fill="#fff"
       de fabrica y en el tema claro eso era blanco sobre blanco: un circulo
       vacio donde tenia que estar el icono de Hoy. */
    .barra-tabs .fan path{fill:currentColor}
    .barra-tabs button.on .fan{border:0;background:var(--ig)}
    .barra-tabs button.on .fan path{fill:#fff}
    .barra-tabs button.on .fan ellipse{display:inline}

    @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>

  <!-- Sin emparejar -->
  <section class="estado hidden" id="empty">
    <div class="halo"></div>
    <span class="logo" data-fantasma></span>
    <h2 id="eTitle">Empareja tu móvil</h2>
    <p id="eBody"></p>
    <ol class="pasos" id="ePasos"></ol>
  </section>

  <!-- Emparejado, pero el PC aun no ha mandado nada -->
  <section class="estado hidden" id="waiting">
    <div class="halo"></div>
    <div class="punto-vivo"></div>
    <h2 id="wTitle">Esperando a tu PC…</h2>
    <p id="wBody"></p>
  </section>

  <!-- La app -->
  <main class="hidden" id="dash">
    <!-- Hoy -->
    <section class="vista" id="v-hoy">
      <div class="halo"></div>
      <div class="arriba">
        <div class="marca"><span class="logo" data-fantasma></span><b>Ghoosted</b></div>
        <button class="redondo" id="refrescar" type="button" aria-label="Actualizar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
        </button>
        <button class="redondo" id="tema" type="button" aria-label="Tema">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="heroe">
        <div class="et" id="hEt">Esta semana</div>
        <div class="cifra"><b id="hCifra">0</b><span id="hUnidad">seguidores</span></div>
        <div class="pildora" id="sync"><i></i><span id="syncTxt"></span></div>
      </div>
      <div class="tarjeta">
        <div class="tres">
          <button type="button" class="r" data-ir="unfollow"><b id="cUnf">0</b><span id="lUnf">Te dejaron</span></button>
          <button type="button" class="v" data-ir="new"><b id="cNew">0</b><span id="lNew">Nuevos</span></button>
          <button type="button" data-ir="notback"><b id="cNb">0</b><span id="lNb">No te siguen</span></button>
        </div>
        <div class="semana">
          <div class="semana-cab"><b id="gTit">Últimos 7 días</b><span id="gRes"></span></div>
          <div class="barras" id="barras"></div>
          <div class="dias" id="dias"></div>
        </div>
      </div>
      <div class="seccion"><b id="rTit">Lo último</b><button type="button" id="rVer">Ver todo</button></div>
      <div class="grupo" id="recientes"></div>
      <p class="nota" id="notaPc"></p>
    </section>

    <!-- Personas -->
    <section class="vista hidden" id="v-personas">
      <h1 class="titulo" id="tPer">Personas</h1>
      <div class="segmentos" id="segmentos"></div>
      <label class="buscar" id="buscarCaja">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="find" type="search" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <div id="listaPer"></div>
    </section>

    <!-- Historias -->
    <section class="vista hidden" id="v-historias">
      <h1 class="titulo" id="tHis">Historias</h1>
      <div id="listaHis"></div>
    </section>

    <!-- Actividad -->
    <section class="vista hidden" id="v-actividad">
      <h1 class="titulo" id="tAct">Actividad</h1>
      <div id="listaAct"></div>
    </section>

  </main>

  <script>
  (function () {

    var T = ES ? {

      a_photo: 'Cambió su foto', a_bio: 'Cambió su bio', a_name: 'Cambió su nombre',

      a_photo: 'Changed photo', a_bio: 'Changed bio', a_name: 'Changed name',
      a_user: 'Changed handle', a_story: 'Posted a story',
      a_fadd: 'Started following ', a_frem: 'Unfollowed ',
      vivo: 'Checked', viejo: 'PC off · last check', just: 'just now',
      wTitle: 'Waiting for your PC…',

      badKey: 'Invalid pairing link. Scan the code from your PC again.'
    };
    document.documentElement.lang = ES ? 'es' : 'en';

    /* El fantasma, uno solo, puesto donde haga falta. Mismos ojos que en la web. */
    var FANTASMA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M5 10a7 7 0 0 1 14 0v9.4a.6.6 0 0 1-.95.49L16 18.2l-1.6 1.3a.6.6 0 0 1-.76 0L12 18.4l-1.64 1.1a.6.6 0 0 1-.76 0L8 18.2l-2.05 1.19A.6.6 0 0 1 5 18.9Z"/><ellipse cx="9.2" cy="10.9" rx="1.75" ry="2.15" fill="#241036"/><ellipse cx="14.8" cy="10.9" rx="1.75" ry="2.15" fill="#241036"/></svg>';
    Array.prototype.forEach.call(document.querySelectorAll('[data-fantasma]'), function (el) { el.innerHTML = FANTASMA; });

    function $(id) { return document.getElementById(id); }
    function texto(id, t) { var el = $(id); if (el) el.textContent = t; }
    texto('nHoy', T.hoy); texto('nPer', T.personas); texto('nHis', T.historias); texto('nAct', T.actividad);
    texto('tPer', T.personas); texto('tHis', T.historias); texto('tAct', T.actividad);
    texto('lUnf', T.unf); texto('lNew', T.neu); texto('lNb', T.nb);
    texto('hEt', T.semana); texto('gTit', T.g_tit); texto('rTit', T.recientes); texto('rVer', T.ver);
    texto('notaPc', T.nota_pc);
    texto('wTitle', T.wTitle); texto('wBody', T.wBody);
    texto('eTitle', T.eTitle); texto('eBody', T.eBody);
    $('ePasos').innerHTML = [T.p1, T.p2, T.p3].map(function (p, i) {
      return '<li><b>' + (i + 1) + '</b><span>' + esc(p) + '</span></li>';
    }).join('');
    $('find').placeholder = T.find_ph;

    /* Tema. Sin eleccion guardada manda el telefono; en cuanto se pulsa, manda
       el boton y se recuerda. theme-color se actualiza para que la barra del
       navegador no se quede del color contrario. */
    var TEMA = 'ghosted_m_tema';
    (function () {
      var guardado = null;
      try { guardado = localStorage.getItem(TEMA); } catch (e) {}
      function claroAhora() {
        var t = document.documentElement.getAttribute('data-tema');
        return t === 'claro' || (!t && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
      }
      function pintar(t) {
        if (t) document.documentElement.setAttribute('data-tema', t);
        else document.documentElement.removeAttribute('data-tema');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', claroAhora() ? '#f2f2f7' : '#000000');
      }
      pintar(guardado);
      $('tema').addEventListener('click', function () {
        var siguiente = claroAhora() ? 'oscuro' : 'claro';
        try { localStorage.setItem(TEMA, siguiente); } catch (e) {}
        pintar(siguiente);
      });
    })();

    /* ---------------- datos: emparejado, cifrado, sondeo ----------------
       Esta parte es la de antes, igual. Lo que cambia es como se pinta. */
    var STORE = 'ghosted_m';
    function b64urlToBytes(s) {
      s = String(s).replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      var bin = atob(s), out = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }
    function b64ToBytes(s) {
      var bin = atob(String(s)), out = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    // 1) Emparejar: #<canal>~<clave> desde el QR, se guarda y se quita de la URL.
    var hash = location.hash.replace(/^#/, '');
    if (hash.indexOf('~') !== -1) {
      var parts = hash.split('~');
      if (parts[0] && parts[1]) {
        try { localStorage.setItem(STORE, JSON.stringify({ channel: parts[0], key: parts[1] })); } catch (e) {}
      }
      history.replaceState(null, '', location.pathname);
    }
    /* #demo: datos de ejemplo, para enseñar la app sin emparejar. No toca el
       emparejamiento guardado ni habla con el servidor. */
    var DEMO = hash === 'demo';
    var pair = null;
    try { pair = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) {}

    function show(which) {
      $('dash').classList.toggle('hidden', which !== 'dash');
      $('waiting').classList.toggle('hidden', which !== 'wait');
      $('empty').classList.toggle('hidden', which !== 'empty');
    }

    async function decrypt(blobB64) {
      var raw = b64ToBytes(blobB64);
      var iv = raw.slice(0, 12), ct = raw.slice(12);
      var key = await crypto.subtle.importKey('raw', b64urlToBytes(pair.key), { name: 'AES-GCM' }, false, ['decrypt']);
      var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
      return JSON.parse(new TextDecoder().decode(pt));
    }

    /* ---------------- utilidades ---------------- */
    // Todo lo que viene de Instagram lo escribe un tercero: nombres, bios, @.
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
    function initials(u) { return (String(u || '?').replace(/[^a-z0-9]/gi, '')[0] || '?').toUpperCase(); }
    function num(n) { return Number(n || 0).toLocaleString(ES ? 'es-ES' : 'en-US'); }
    function ago(ts) {
      var s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
      if (s < 45) return T.just;
      var m = Math.floor(s / 60); if (m < 60) return (ES ? 'hace ' : '') + m + ' min' + (ES ? '' : ' ago');
      var h = Math.floor(m / 60); if (h < 24) return (ES ? 'hace ' : '') + h + ' h' + (ES ? '' : ' ago');
      var d = Math.floor(h / 24); return (ES ? 'hace ' : '') + d + ' d' + (ES ? '' : ' ago');
    }
    function corto(ts) {
      var s = Math.max(0, Math.floor((Date.now() - ts) / 1000)), m = Math.floor(s / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
      if (m < 1) return T.just; if (m < 60) return m + ' min'; if (h < 24) return h + ' h'; if (d < 7) return d + ' d';
      return Math.floor(d / 7) + (ES ? ' sem' : ' w');
    }
    function norm(t) { return String(t || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }
    function inicioDia(ts) { var d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }

    /* Sin foto, un circulo de color que es siempre el mismo para la misma
       persona. Gris para todos no distingue a nadie. */
    var TONOS = [['#ffb36b', '#c0562f'], ['#7b8cff', '#3a3f9e'], ['#6fd6b8', '#237a67'], ['#f59ac0', '#a93a72'],
                 ['#c9a0ff', '#6b3fb0'], ['#ffd36b', '#b8860b'], ['#7fd1ff', '#2270a8'], ['#ff8a8a', '#a83232']];
    function tono(u) { var h = 0, s = String(u || ''); for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return TONOS[h % TONOS.length]; }
    function avatar(p, aro) {
      var t = tono(p.username), inner;
      // Solo picData: la CSP no deja pedir fotos a Instagram, y ademas esas
      // URLs caducan. Lo que no venga incrustado sale con la inicial.
      if (p.picData) inner = '<span class="av"><img alt="" src="' + esc(p.picData) + '" onerror="this.remove()"></span>';
      else inner = '<span class="av" style="background:linear-gradient(150deg,' + t[0] + ',' + t[1] + ')">' + initials(p.username) + '</span>';
      return aro ? '<span class="aro-caja aro">' + inner + '</span>' : inner;
    }
    var FLECHA = '<svg viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1 1 6 6-6 6"/></svg>';
    function perfil(u) { return u ? 'https://www.instagram.com/' + encodeURIComponent(u) + '/' : null; }

    /* Una fila. Toda la que tiene @ abre el perfil: en el movil eso abre la
       app de Instagram directamente, que es lo que se quiere hacer al ver un
       nombre en esta lista. */
    function fila(p, o) {
      o = o || {};
      var url = perfil(p.username);
      var abre = url ? '<a class="fila" href="' + esc(url) + '" target="_blank" rel="noopener">' : '<div class="fila">';
      var cierra = url ? '</a>' : '</div>';
      var nombre = p.full_name || (p.username ? '@' + p.username : '');
      var debajo = o.linea != null ? o.linea : (p.full_name && p.username ? '@' + p.username : '');
      var punto = o.punto ? '<em style="--punto:' + o.punto + '">' + esc(o.puntoTxt || '') + '</em>' : '';
      var izq = o.rango != null ? '<span class="rango">' + o.rango + '</span>' : '';
      var der = o.der != null ? o.der : '<span class="derecha">' + (p.ts ? esc(corto(p.ts)) : '') + (url ? FLECHA : '') + '</span>';
      return abre + izq + avatar(p, o.aro) + '<span class="quien"><b>' + esc(nombre) + '</b>' +
        (debajo ? '<span>' + esc(debajo) + '</span>' : '') + punto + '</span>' + der + cierra;
    }
    function vacio(t) {
      return '<div class="grupo"><div class="vacio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5c1.9 1.8 5.1 1.8 7 0M9 9.6h.01M15 9.6h.01" stroke-width="2.2"/></svg>' + esc(t) + '</div></div>';
    }

    /* ---------------- estado ---------------- */
    var datos = null, vista = 'hoy', seg = 'unfollow', busqueda = '';

    /* Los siete ultimos dias, con los que entraron y los que se fueron cada
       dia. Sale de las propias listas —cada entrada lleva su hora— asi que el
       PC no tiene que mandar nada nuevo para esto. */
    function semana(d) {
      var tabs = d.tabs || {}, hoy = inicioDia(Date.now()), dias = [];
      for (var i = 6; i >= 0; i--) dias.push({ t: hoy - i * 864e5, mas: 0, menos: 0 });
      function cuenta(lista, campo) {
        (lista || []).forEach(function (e) {
          if (!e.ts) return;
          var k = Math.round((inicioDia(e.ts) - dias[0].t) / 864e5);
          if (k >= 0 && k < 7) dias[k][campo]++;
        });
      }
      cuenta(tabs.new, 'mas'); cuenta(tabs.unfollow, 'menos');
      return dias;
    }

    function pintarHoy() {
      var d = datos, tabs = d.tabs || {}, c = d.counts || {};
      var dias = semana(d);
      var mas = dias.reduce(function (a, x) { return a + x.mas; }, 0);
      var menos = dias.reduce(function (a, x) { return a + x.menos; }, 0);
      var neto = mas - menos;
      var b = $('hCifra');
      b.textContent = (neto > 0 ? '+' : neto < 0 ? '−' : '') + num(Math.abs(neto));
      b.classList.toggle('menos', neto < 0);
      $('hUnidad').textContent = Math.abs(neto) === 1 ? T.seguidor : T.seguidores;

      $('cUnf').textContent = num((tabs.unfollow || []).length);
      $('cNew').textContent = num((tabs.new || []).length);
      $('cNb').textContent = c.notback != null ? num(c.notback) : num((tabs.notback || []).length);
      $('gRes').textContent = '+' + mas + ' ' + T.g_mas + ' · ' + menos + ' ' + T.g_menos;

      /* Barras que suben (entraron) y bajan (se fueron) desde una linea
         central. Escala comun a las dos mitades para que se comparen. */
      var tope = Math.max(1, dias.reduce(function (a, x) { return Math.max(a, x.mas, x.menos); }, 0));
      var fmt = ES ? ['D', 'L', 'M', 'X', 'J', 'V', 'S'] : ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
      $('barras').innerHTML = dias.map(function (x, i) {
        var hoy = i === 6 ? ' hoy' : '';
        return '<div class="barra' + hoy + '" title="+' + x.mas + ' / −' + x.menos + '">' +
          '<div class="sube"><i style="height:' + (x.mas ? Math.max(8, x.mas / tope * 100) : 0) + '%"></i></div>' +
          '<div class="baja"><i style="height:' + (x.menos ? Math.max(8, x.menos / tope * 100) : 0) + '%"></i></div></div>';
      }).join('');
      $('dias').innerHTML = dias.map(function (x, i) {
        return '<span' + (i === 6 ? ' class="hoy"' : '') + '>' + fmt[new Date(x.t).getDay()] + '</span>';
      }).join('');

      // Lo ultimo: los cinco cambios mas recientes, entre entradas y salidas.
      var rec = [].concat(
        (tabs.unfollow || []).map(function (p) { return { p: p, t: 'u' }; }),
        (tabs.new || []).map(function (p) { return { p: p, t: 'n' }; })
      ).filter(function (x) { return x.p.ts; }).sort(function (a, b) { return b.p.ts - a.p.ts; }).slice(0, 5);
      $('recientes').innerHTML = rec.length ? rec.map(function (x) {
        return fila(x.p, { aro: x.t === 'n', punto: x.t === 'u' ? 'var(--red)' : 'var(--green)', puntoTxt: x.t === 'u' ? T.unfollowed : T.followed, linea: '' });
      }).join('') : '<div class="vacio">' + esc(T.e_rec) + '</div>';
    }

    function pintarPersonas() {
      var tabs = datos.tabs || {}, c = datos.counts || {};
      var defs = [['unfollow', T.unf, (tabs.unfollow || []).length], ['new', T.neu, (tabs.new || []).length],
                  ['notback', T.nb, c.notback != null ? c.notback : (tabs.notback || []).length]];
      $('segmentos').innerHTML = defs.map(function (s) {
        return '<button type="button" data-s="' + s[0] + '"' + (s[0] === seg ? ' class="on"' : '') + '>' + esc(s[1]) + '<em>' + num(s[2]) + '</em></button>';
      }).join('');

      var items = (tabs[seg] || []).slice();
      $('buscarCaja').hidden = items.length < 8;
      if (busqueda) {
        var q = norm(busqueda);
        items = items.filter(function (e) { return norm(e.username).indexOf(q) >= 0 || norm(e.full_name).indexOf(q) >= 0; });
      }
      var caja = $('listaPer');
      if (!items.length) {
        caja.innerHTML = vacio(busqueda ? T.find_none : seg === 'unfollow' ? T.e_unf : seg === 'new' ? T.e_new : T.e_nb);
        return;
      }
      var opc = seg === 'unfollow' ? { punto: 'var(--red)', puntoTxt: T.unfollowed }
              : seg === 'new' ? { punto: 'var(--green)', puntoTxt: T.followed, aro: true } : {};

      // "No te siguen" no tiene hora: va entero, en un solo bloque.
      if (seg === 'notback') { caja.innerHTML = '<div class="grupo">' + items.map(function (p) { return fila(p, opc); }).join('') + '</div>'; return; }

      /* Agrupado por cuando, como las notificaciones del sistema: lo de hoy
         arriba y separado, que es lo que se viene a mirar. */
      var hoy = inicioDia(Date.now()), sem = hoy - 6 * 864e5, grupos = [[T.g_hoy, []], [T.g_semana, []], [T.g_antes, []]];
      items.forEach(function (p) { var t = p.ts || 0; (t >= hoy ? grupos[0] : t >= sem ? grupos[1] : grupos[2])[1].push(p); });
      caja.innerHTML = grupos.filter(function (g) { return g[1].length; }).map(function (g) {
        return '<div class="etiqueta">' + esc(g[0]) + '</div><div class="grupo">' + g[1].map(function (p) { return fila(p, opc); }).join('') + '</div>';
      }).join('');
    }

    function pintarHistorias() {
      var st = (datos.tabs || {}).stories || [], hist = datos.history || [];
      var html = '';
      if (!st.length) html += vacio(T.e_his);
      else {
        html += '<div class="etiqueta">' + esc(T.his_top) + '</div><div class="grupo">' + st.map(function (e, i) {
          var meta = [];
          if (e.captures) meta.push(e.captures + ' ' + T.caps);
          if (e.likes) meta.push(e.likes + ' ' + T.likes);
          if (e.days) meta.push(e.days + ' ' + T.dias);
          return fila(e, {
            rango: i + 1, aro: i < 3, linea: meta.join(' · ') || (e.username ? '@' + e.username : ''),
            der: '<span class="vistas"><b>' + num(e.slides) + '</b><span>' + esc(T.vistas) + '</span></span>'
          });
        }).join('') + '</div>';
      }
      if (hist.length > 1) {
        var h = hist.slice(0, 24).reverse(), tope = Math.max(1, Math.max.apply(null, h.map(function (x) { return x.viewers || 0; })));
        html += '<div class="etiqueta" style="margin-top:22px">' + esc(T.his_hist) + '</div><div class="grupo"><div class="hist">' +
          h.map(function (x) { return '<i style="height:' + Math.max(5, (x.viewers || 0) / tope * 100) + '%" title="' + (x.viewers || 0) + '"></i>'; }).join('') +
          '</div><div class="hist-pie"><span>' + esc(ago(h[0].ts)) + '</span><span>' + esc(num(h[h.length - 1].viewers)) + ' · ' + esc(ago(h[h.length - 1].ts)) + '</span></div></div>';
      }
      $('listaHis').innerHTML = html;
    }

    function actLabel(e) {
      var t = e.target && e.target.username ? '@' + e.target.username : '';
      return ({ unfollow: T.unfollowed, new: T.followed, photo: T.a_photo, bio: T.a_bio, name: T.a_name,
                username: T.a_user, story: T.a_story, follow_add: T.a_fadd + t, follow_rem: T.a_frem + t })[e.type] || e.type || '';
    }
    function actColor(t) {
      return ({ unfollow: 'var(--red)', new: 'var(--green)', follow_rem: 'var(--red)', follow_add: 'var(--green)', story: '#d62976' })[t] || 'var(--blue)';
    }
    function pintarActividad() {
      var a = (datos.tabs || {}).activity || [];
      $('listaAct').innerHTML = a.length ? '<div class="grupo">' + a.map(function (e) {
        return fila(e, { punto: actColor(e.type), puntoTxt: actLabel(e), linea: '', aro: e.type === 'story' });
      }).join('') + '</div>' : vacio(T.e_act);
    }

    function pintar() {
      if (!datos) return;
      if (vista === 'hoy') pintarHoy();
      else if (vista === 'personas') pintarPersonas();
      else if (vista === 'historias') pintarHistorias();
      else pintarActividad();
    }

    function irA(v) {
      vista = v;
      ['hoy', 'personas', 'historias', 'actividad'].forEach(function (k) { $('v-' + k).classList.toggle('hidden', k !== v); });
      var orden = ['hoy', 'personas', 'historias', 'actividad'], i = orden.indexOf(v);
      Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.classList.toggle('on', b.dataset.v === v); });
      // Cada boton mide un cuarto y entre ellos hay 2px de hueco.
      $('capsula').style.transform = 'translateX(calc(' + i + ' * (100% + 2px)))';
      window.scrollTo(0, 0);
      pintar();
    }

    $('tabs').addEventListener('click', function (e) { var b = e.target.closest('button[data-v]'); if (b) irA(b.dataset.v); });
    // Las tres cifras de Hoy llevan a su lista.
    document.querySelector('.tres').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-ir]'); if (!b) return;
      seg = b.dataset.ir; busqueda = ''; $('find').value = ''; irA('personas');
    });
    $('rVer').addEventListener('click', function () { seg = 'unfollow'; irA('personas'); });
    $('segmentos').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-s]'); if (!b) return;
      // Al cambiar de lista se quita el filtro: si no, se ve vacia y parece
      // que no hay nadie, cuando lo que hay es una busqueda puesta.
      seg = b.dataset.s; busqueda = ''; $('find').value = ''; pintarPersonas();
    });
    $('find').addEventListener('input', function () { busqueda = this.value; pintarPersonas(); });

    function render(d) {
      datos = d;
      show('dash');
      var viejo = Date.now() - (d.ts || 0) > 30 * 60000;
      $('sync').classList.toggle('viejo', viejo);
      $('syncTxt').textContent = (viejo ? T.viejo : T.vivo) + ' ' + ago(d.ts || Date.now());
      pintar();
    }

    /* ---------------- arranque ---------------- */
    if (DEMO) {
      /* Datos de ejemplo. Las horas se calculan desde ahora para que la
         grafica de la semana tenga algo que enseñar el dia que se abra. */
      var H = 36e5, ahora = Date.now();
      function p(u, n, h) { return { username: u, full_name: n, ts: ahora - h * H }; }
      render({
        v: 1, ts: ahora - 3 * 60000,
        counts: { followers: 1415, following: 1131, notback: 67 },
        tabs: {
          unfollow: [p('jujulonlon', 'ahah ☺️👌', 2), p('truly.only_sanskruti', 'Sanskruti 🎀', 20), p('edouard_31k', '', 50), p('p.vidal', 'Pablo Vidal', 96), p('laura.mzz', 'Laura M.', 130)],
          new: [p('sofi.palms', 'sofi 🌴', 5), p('mgidrewicz', 'Marcel Gidrewicz', 9), p('ana_bcn', 'Ana 🌙', 26), p('dario.fx', 'Darío', 30), p('carla.ms', 'Carla', 55),
                p('iker32_', 'Iker', 75), p('noe.art', 'Noe', 80), p('marta_rz', 'Marta', 100), p('jon.eder', 'Jon', 121), p('lu.cia', 'Lucía', 140), p('the.tomas', 'Tomás', 150), p('ele.na', 'Elena', 160)],
          notback: ['nike', 'natgeo', 'bad.bunny', 'rosalia.vt', 'spotify', 'cristiano', 'zara', 'netflix', 'apple', 'nasa']
            .map(function (u) { return { username: u, full_name: '' }; }),
          activity: [
            { type: 'story', username: 'sofi.palms', full_name: 'sofi 🌴', ts: ahora - 1 * H },
            { type: 'unfollow', username: 'jujulonlon', full_name: 'ahah ☺️👌', ts: ahora - 2 * H },
            { type: 'photo', username: 'carla.ms', full_name: 'Carla', ts: ahora - 6 * H },
            { type: 'follow_add', username: 'ana_bcn', full_name: 'Ana 🌙', target: { username: 'dario.fx' }, ts: ahora - 11 * H },
            { type: 'bio', username: 'iker32_', full_name: 'Iker', ts: ahora - 30 * H },
            { type: 'new', username: 'mgidrewicz', full_name: 'Marcel Gidrewicz', ts: ahora - 9 * H }
          ],
          stories: [
            { username: 'carlos.rv', full_name: 'Carlos', slides: 48, captures: 2, likes: 6, days: 12 },
            { username: 'maria.jl', full_name: 'María', slides: 41, likes: 3, days: 10 },
            { username: 'pedro_gs', full_name: 'Pedro', slides: 35, days: 8 },
            { username: 'sofi.palms', full_name: 'sofi 🌴', slides: 22, likes: 1, days: 6 },
            { username: 'ana_bcn', full_name: 'Ana 🌙', slides: 17, days: 5 }
          ]
        },
        history: [210, 198, 240, 188, 205, 260, 231, 219, 274, 246, 252, 290].map(function (v, i) { return { ts: ahora - (11 - i) * 20 * H, viewers: v }; }).reverse()
      });
      $('refrescar').addEventListener('click', function () {});
      return;
    }

    if (!pair) { show('empty'); return; }

    var polling = false;
    async function tick() {
      if (polling) return; polling = true;
      $('refrescar').classList.add('gira');
      try {
        var r = await fetch('/api/m/pull?channel=' + encodeURIComponent(pair.channel), { cache: 'no-store' }).then(function (x) { return x.json(); });
        if (!r || !r.ok) return;
        if (!r.blob) { if (!datos) show('wait'); return; }
        render(await decrypt(r.blob));
      } catch (e) {
        if (e && (e.name === 'OperationError' || String(e).indexOf('decrypt') !== -1) && !datos) {
          show('wait');
          texto('wTitle', T.badKey);
        }
      } finally {
        polling = false;
        setTimeout(function () { $('refrescar').classList.remove('gira'); }, 350);
      }
    }
    $('refrescar').addEventListener('click', tick);

    if (!datos) show('wait');
    tick();
    setInterval(tick, 20000);
    window.addEventListener('focus', tick);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });
  })();
  </script>
</body>
</html>
