<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ghoosted — Ventas</title>
  <meta name="robots" content="noindex,nofollow,noarchive">
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    .ad{max-width:1140px;margin:0 auto;padding:26px 18px 60px}
    .ad h1{font-family:var(--display);font-size:30px;letter-spacing:-1px;margin:0 0 4px}
    .ad .sub{color:var(--ink-2);font-size:14px;margin:0 0 22px}
    .ad-login{max-width:380px;margin:12vh auto;text-align:center}
    .ad input[type=password],.ad input[type=search]{width:100%;box-sizing:border-box;border:1px solid var(--line-2);
      border-radius:12px;padding:12px 14px;font:400 15px var(--font);background:var(--paper);color:var(--ink)}
    .ad button{border:0;border-radius:12px;background:var(--ink);color:#F7F5F0;padding:12px 18px;
      font:700 14px var(--font);cursor:pointer}
    .ad button.mini{padding:6px 10px;font-size:12px;border-radius:9px;margin:0 2px 2px 0}
    .ad button.gris{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
    .ad button.rojo{background:var(--alert)}
    .cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:11px;margin:0 0 22px}
    .cifra{border:1px solid var(--line);border-radius:14px;padding:13px 15px;background:var(--paper)}
    .cifra b{display:block;font:700 24px var(--font);letter-spacing:-.5px}
    .cifra span{font-size:12px;color:var(--ink-2)}
    .barra{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}
    /* El buscador se queda con lo que sobra, los botones con lo que piden: sin
       esto el input se lo comia todo y "Regalar Pro" partia en dos lineas. */
    .barra input{flex:1 1 260px;min-width:0}
    .barra button{flex:0 0 auto;white-space:nowrap}
    .vacio{padding:30px 4px;color:var(--ink-3);font-size:14px}
    .seccion{font-family:var(--display);font-size:21px;letter-spacing:-.5px;margin:38px 0 14px;
      display:flex;align-items:center;gap:10px}
    .pendientes{font:700 11px var(--font);letter-spacing:.04em;background:var(--ink);color:#F7F5F0;
      border-radius:100px;padding:4px 10px}
    .ad button.verde{background:#127a4a;color:#fff;border:0}
    .ad-login .aviso{margin-top:18px;padding:13px 15px;border-radius:12px;background:var(--paper);
      border:1px solid var(--line-2);font-size:13px;line-height:1.6;color:var(--ink-2);text-align:left}
    .ad-login code{font-size:12.5px}
    .tabla{width:100%;border-collapse:collapse;font-size:13px;background:var(--paper);
      border:1px solid var(--line);border-radius:14px;overflow:hidden}
    .tabla th{text-align:left;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;
      color:var(--ink-2);padding:10px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
    .tabla td{padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:top}
    .tabla tr:last-child td{border-bottom:0}
    .k{font:600 12px ui-monospace,monospace;white-space:nowrap}
    .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
    .ok{background:rgba(40,140,80,.14);color:#1F6B43}
    .no{background:rgba(196,68,58,.14);color:#8E2C24}
    .warn{background:rgba(214,66,126,.14);color:#A5245C}
    .gris2{color:var(--ink-3)}
    .envuelve{overflow-x:auto}
    .msg{margin:12px 0 0;font-size:13.5px}
  </style>
</head>
<body>
  <main class="ad">
    <div id="login" class="ad-login">
      <h1>Ventas</h1>
      <p class="sub">Pega el token del panel.</p>
      <input id="tok" type="password" autocomplete="off" placeholder="ADMIN_TOKEN">
      <p><button id="entrar" style="width:100%;margin-top:10px">Entrar</button></p>
      <p id="loginMsg" class="msg"></p>
      <p class="aviso">Es el valor de <code>ADMIN_TOKEN</code> en Vercel → Settings →
        Environment Variables. Si no lo has puesto todavía, el panel no existe:
        ponlo, vuelve a desplegar, y entra con ese mismo valor.</p>
    </div>

    <div id="panel" hidden>
      <h1>Ventas</h1>
      <p class="sub" id="sub"></p>
      <div class="cifras" id="cifras"></div>
      <div class="barra">
        <input id="buscar" type="search" placeholder="Buscar por correo, clave o cuenta…">
        <button id="recargar" class="gris">Recargar</button>
        <button id="regalar-pro" class="gris">Regalar Pro</button>
        <button id="regalar-plus" class="gris">Regalar Plus</button>
      </div>
      <div class="envuelve"><table class="tabla" id="tabla"></table></div>
      <p class="vacio" id="vacio" hidden></p>

      <h2 class="seccion">Creadores <span class="pendientes" id="nPend" hidden></span></h2>
      <div class="envuelve"><table class="tabla" id="tablaCr"></table></div>
      <p class="vacio" id="vacioCr" hidden></p>
      <p id="msg" class="msg"></p>
    </div>
  </main>

  <script>
  (function () {
    var TOK = '';
    try { TOK = sessionStorage.getItem('ghd_admin') || ''; } catch (e) {}
    var datos = null;
    var $ = function (id) { return document.getElementById(id); };

    /* El correo y el telefono los escribe el COMPRADOR en la pantalla de
       Stripe. Aqui se pintan dentro de una tabla, y este panel es el sitio con
       mas que perder: quien logre ejecutar algo en esta pagina se lleva el
       token y puede revocar todas las licencias. Que Stripe valide el formato
       no es defensa: la defensa es escapar aqui. */
    function esc(v) {
      return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function pedir(ruta, opciones) {
      opciones = opciones || {};
      opciones.headers = Object.assign({ Authorization: 'Bearer ' + TOK }, opciones.headers || {});
      return fetch(ruta, opciones).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, status: r.status, d: d }; });
      });
    }

    function fecha(iso) {
      if (!iso) return '—';
      var d = new Date(iso);
      return d.toLocaleDateString() + ' ' + d.toLocaleTimeString().slice(0, 5);
    }

    /* Lo que devuelve el servidor son codigos, no frases. Enseñarlos tal cual
       deja al unico que usa esto mirando un "Error: no_encontrado" que no dice
       ni que ha pasado ni que hacer. */
    function porQue(r) {
      var c = (r.d && r.d.error) || '';
      if (c === 'no_encontrado' || r.status === 404)
        return 'El panel no está encendido: falta la variable ADMIN_TOKEN en Vercel. '
             + 'Ponla en Settings → Environment Variables (Production) y vuelve a desplegar.';
      if (c === 'no_autorizado' || r.status === 401) return 'Ese token no es el que hay puesto en Vercel.';
      if (c === 'demasiados_intentos') return 'Demasiados intentos seguidos. Espera un minuto.';
      if (c === 'almacen_no_configurado') return 'El almacén de claves no responde. Mira las variables de KV en Vercel.';
      if (c === 'clave_mal_formada') return 'Esa clave no tiene la forma GHST-XXXX-XXXX-XXXX-XXXX-XXXX.';
      if (c === 'no_existe') return 'Esa clave no existe.';
      return 'Algo ha fallado (' + (c || r.status) + ').';
    }

    function cargar() {
      $('msg').textContent = 'Cargando…';
      return pedir('/api/admin').then(function (r) {
        /* 404 tambien echa fuera: significa que el panel no existe todavia en
           el servidor. Antes se quedaba aqui dentro, vacio y con un codigo
           puesto debajo, como si el fallo fuera de esta pantalla. */
        if (r.status === 401 || r.status === 404) { salir(porQue(r)); return; }
        if (!r.ok) { $('msg').textContent = porQue(r); return; }
        datos = r.d; $('msg').textContent = '';
        pintar();
      });
    }

    function salir(texto) {
      try { sessionStorage.removeItem('ghd_admin'); } catch (e) {}
      TOK = ''; $('panel').hidden = true; $('login').hidden = false;
      $('loginMsg').textContent = texto || '';
    }

    function cifra(valor, etiqueta) {
      return '<div class="cifra"><b>' + esc(valor) + '</b><span>' + esc(etiqueta) + '</span></div>';
    }

    function pintar() {
      var r = datos.resumen;
      var planes = Object.keys(r.porPlan).map(function (p) { return esc(p) + ' ' + esc(r.porPlan[p]); }).join(' · ');
      $('cifras').innerHTML =
        cifra(r.total, 'ventas') +
        cifra(r.activas, 'claves activas') +
        cifra(r.activadas, 'ya instaladas') +
        cifra(r.revocadas, 'revocadas') +
        cifra(r.conAbuso, 'con intentos de otra cuenta') +
        cifra(r.ingresosBrutos + ' €', 'bruto aproximado');
      $('sub').textContent = planes + (datos.completo ? '' : ' · lista recortada');
      filtrar();
      pintarCreadores();
    }

    function filtrar() {
      var q = $('buscar').value.trim().toLowerCase();
      var filas = datos.licencias.filter(function (l) {
        if (!q) return true;
        return [l.key, l.email, l.cuenta, l.plan].join(' ').toLowerCase().indexOf(q) !== -1;
      });
      var html = '<tr><th>Clave</th><th>Plan</th><th>Comprador</th><th>Comprada</th>'
        + '<th>Cuenta IG</th><th>Entrega</th><th>Estado</th><th></th></tr>';
      filas.forEach(function (l) {
        var entrega = [];
        if (l.enviado && l.enviado.email) entrega.push('correo');
        if (l.enviado && l.enviado.sms) entrega.push('sms');
        var abuso = l.abuso && l.abuso.veces
          ? ' <span class="pill warn" title="' + esc((l.abuso.cuentas || []).join(', ')) + '">'
            + esc(l.abuso.veces) + ' intentos</span>' : '';
        html += '<tr>'
          + '<td class="k">' + esc(l.key) + '</td>'
          + '<td>' + esc(l.plan) + '</td>'
          + '<td>' + (l.email ? esc(l.email) : '<span class="gris2">—</span>')
            + (l.telefono ? '<br><span class="gris2">' + esc(l.telefono) + '</span>' : '') + '</td>'
          + '<td class="gris2">' + esc(fecha(l.comprada)) + '</td>'
          + '<td class="k">' + (l.cuenta ? esc(l.cuenta) : '<span class="gris2">sin activar</span>') + abuso + '</td>'
          + '<td class="gris2">' + (entrega.length ? esc(entrega.join(' + ')) : 'nada') + '</td>'
          + '<td><span class="pill ' + (l.estado === 'active' ? 'ok' : 'no') + '">'
            + (l.estado === 'active' ? 'activa' : 'revocada') + '</span></td>'
          + '<td style="white-space:nowrap">'
          + (l.estado === 'active'
              ? '<button class="mini rojo" data-a="revocar" data-k="' + esc(l.key) + '">Revocar</button>'
              : '<button class="mini gris" data-a="reactivar" data-k="' + esc(l.key) + '">Reactivar</button>')
          + '<button class="mini gris" data-a="soltar" data-k="' + esc(l.key) + '">Soltar cuenta</button>'
          + '<button class="mini gris" data-a="reenviar" data-k="' + esc(l.key) + '">Reenviar</button>'
          + '<button class="mini gris" data-a="enviar_a" data-k="' + esc(l.key) + '">Correo…</button>'
          + '<button class="mini gris" data-w="' + esc(l.key) + '">WhatsApp</button>'
          + '</td></tr>';
      });
      $('tabla').innerHTML = filas.length ? html : '';
      $('vacio').hidden = filas.length > 0;
      $('vacio').textContent = datos.licencias.length
        ? 'Ninguna coincide con lo que has buscado.'
        : 'Todavía no hay ninguna venta. Los botones de regalar de arriba emiten una clave sin cobrarla.';
    }

    function pintarCreadores() {
      var cr = datos.creadores || [];
      var pend = cr.filter(function (c) { return c.estado === 'pendiente'; }).length;
      $('nPend').hidden = !pend;
      $('nPend').textContent = pend + ' sin decidir';
      if (!cr.length) {
        $('tablaCr').innerHTML = '';
        $('vacioCr').hidden = false;
        $('vacioCr').textContent = 'Nadie ha pedido entrar todavia.';
        return;
      }
      $('vacioCr').hidden = true;
      var html = '<tr><th>Codigo</th><th>Quien</th><th>Correo</th><th>Canal</th>'
        + '<th>Seguidores</th><th>Pedido</th><th>Estado</th><th></th></tr>';
      cr.forEach(function (c) {
        var pill = c.estado === 'aprobado' ? 'ok' : (c.estado === 'rechazado' ? 'no' : 'warn');
        html += '<tr>'
          + '<td class="k">' + esc(c.codigo) + '</td>'
          + '<td>' + esc(c.nombre || '—') + '</td>'
          + '<td>' + esc(c.email || '—') + '</td>'
          + '<td>' + esc(c.canal || '—') + '</td>'
          + '<td class="gris2">' + esc(c.seguidores || '—') + '</td>'
          + '<td class="gris2">' + esc(fecha(c.creado)) + '</td>'
          + '<td><span class="pill ' + pill + '">' + esc(c.estado) + '</span></td>'
          + '<td style="white-space:nowrap">'
          + (c.estado === 'pendiente'
              ? '<button class="mini verde" data-a="aprobar_creador" data-c="' + esc(c.codigo) + '">Aprobar</button>'
                + '<button class="mini rojo" data-a="rechazar_creador" data-c="' + esc(c.codigo) + '">Rechazar</button>'
              : '<span class="gris2">' + esc(fecha(c.decidido)) + '</span>')
          + '<button class="mini gris" data-a="borrar_creador" data-c="' + esc(c.codigo) + '">Borrar</button>'
          + '</td></tr>';
      });
      $('tablaCr').innerHTML = html;
    }

    var TEXTO = {
      revocar: 'Revocar esta clave? Deja de activar y de descargar. Uselo para devoluciones o fraude.',
      reactivar: 'Volver a dejarla activa?',
      soltar: 'Desatarla de su cuenta de Instagram? La proxima cuenta que la active se queda con ella.',
      reenviar: 'Volver a mandar el correo con la clave?',
      aprobar_creador: 'Aprobar a este creador? Su codigo empieza a contar ventas y se le avisa por correo.',
      rechazar_creador: 'Rechazar esta solicitud? Se le avisa por correo.',
      borrar_creador: 'Borrarla del todo? El codigo queda libre para otro. No se avisa a nadie.',
    };

    /* WhatsApp no pasa por el servidor: se abre wa.me con el mensaje escrito y
       eliges el contacto en tu propio WhatsApp. Sin numero en la URL, porque
       el numero lo sabes tu y no tiene por que estar en ningun sitio nuestro. */
    document.addEventListener('click', function (e) {
      var w = e.target.closest && e.target.closest('button[data-w]');
      if (!w) return;
      var k = w.dataset.w;
      var txt = 'Tu clave de Ghoosted:\n\n' + k + '\n\n'
        + 'Descarga: https://ghoosted.net/api/download?key=' + encodeURIComponent(k) + '\n'
        + 'Como instalarlo: https://ghoosted.net/instalar';
      window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank', 'noopener');
    });

    document.addEventListener('click', function (e) {
      var b = e.target.closest && e.target.closest('button[data-a]');
      if (!b) return;
      var accion = b.dataset.a, key = b.dataset.k, cod = b.dataset.c, extra = {};

      /* Aprobar o rechazar a un creador va por codigo, no por clave. */
      if (cod) {
        if (!confirm(TEXTO[accion] + '\n\n' + cod)) return;
        b.disabled = true;
        pedir('/api/admin', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accion: accion, codigo: cod }),
        }).then(function (r) {
          b.disabled = false;
          if (!r.ok) { $('msg').textContent = porQue(r); return; }
          $('msg').textContent = cod + ' · ' + r.d.estado + '. Se le ha avisado por correo.';
          cargar();
        });
        return;
      }

      if (accion === 'enviar_a') {
        var destino = prompt('A que correo mando ' + key + '?');
        if (!destino) return;
        extra.email = destino.trim();
      } else if (!confirm(TEXTO[accion] + '\n\n' + key)) return;

      b.disabled = true;
      pedir('/api/admin', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({ accion: accion, key: key }, extra)),
      }).then(function (r) {
        b.disabled = false;
        if (!r.ok) { $('msg').textContent = porQue(r); return; }
        $('msg').textContent = r.d.enviado_a
          ? 'Mandada a ' + r.d.enviado_a
          : 'Hecho: ' + accion + ' · ' + key;
        cargar();
      });
    });

    /* Una clave sin cobrar. Para la del dueño y para las que se regalan.
       No manda correo: sale en pantalla y se copia a mano, porque quien la
       pide esta delante. Queda marcada como regalo para que no cuente como
       venta. */
    function regalar(plan) {
      var motivo = prompt('Para quien es esta clave ' + plan.toUpperCase() + '? (queda anotado)');
      if (motivo === null) return;
      pedir('/api/admin', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ accion: 'regalar', plan: plan, motivo: motivo }),
      }).then(function (r) {
        if (!r.ok) { $('msg').textContent = porQue(r); return; }
        $('msg').textContent = 'Clave ' + r.d.plan + ': ' + r.d.key;
        try { navigator.clipboard.writeText(r.d.key); } catch (e) {}
        prompt('Copia la clave. No se manda por correo:', r.d.key);
        cargar();
      });
    }
    $('regalar-pro').addEventListener('click', function () { regalar('pro'); });
    $('regalar-plus').addEventListener('click', function () { regalar('plus'); });

    $('entrar').addEventListener('click', function () {
      TOK = $('tok').value.trim();
      if (!TOK) return;
      try { sessionStorage.setItem('ghd_admin', TOK); } catch (e) {}
      $('login').hidden = true; $('panel').hidden = false;
      cargar();
    });
    $('tok').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('entrar').click(); });
    $('buscar').addEventListener('input', function () { if (datos) filtrar(); });
    $('recargar').addEventListener('click', cargar);

    if (TOK) { $('login').hidden = true; $('panel').hidden = false; cargar(); }
  })();
  </script>
</body>
</html>
