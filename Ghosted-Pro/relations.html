<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ghoosted</title>
  <style>
    :root { color-scheme: dark }
    * { box-sizing: border-box }
    body { margin: 0; background: #0f0f14; color: #f2f2f5;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif }
    .wrap { max-width: 640px; margin: 0 auto; padding: 22px 16px 70px }
    h1 { font-size: 19px; margin: 0 0 3px; letter-spacing: -.01em }
    .sub { color: #9a9aa2; font-size: 12.5px; margin-bottom: 16px }
    #q { width: 100%; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
      border-radius: 12px; color: #fff; font: 14px 'Inter', system-ui; padding: 12px 14px; outline: none; margin-bottom: 10px }
    #q:focus { border-color: #8a3ab9; box-shadow: 0 0 0 3px rgba(138,58,185,.2) }
    #cnt { color: #7c7c83; font-size: 11.5px; margin-bottom: 8px }
    .row { display: flex; align-items: center; gap: 12px; padding: 9px 8px; border-radius: 12px; text-decoration: none; color: inherit }
    .row:hover { background: rgba(255,255,255,.06) }
    .av { width: 44px; height: 44px; border-radius: 50%; flex: none; overflow: hidden;
      background: linear-gradient(140deg,#3a3a44,#55555f); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px }
    .av img { width: 100%; height: 100%; object-fit: cover; display: block }
    .nm { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 5px }
    .us { font-size: 12px; color: #9a9aa2 }
    .ver { color: #3897f0; font-size: 12px }
    .empty { color: #9a9aa2; padding: 44px 0; text-align: center }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="title">Ghoosted</h1>
    <div class="sub" id="sub"></div>
    <input id="q" autocomplete="off" spellcheck="false">
    <div id="cnt"></div>
    <div id="list"></div>
  </div>
  <script src="relations.js"></script>
</body>
</html>
